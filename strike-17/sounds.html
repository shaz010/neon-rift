<head>

<style>
:root{--g:#b6dcae;--bg:#070908;--m:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
html,body{margin:0;background:var(--bg);color:var(--g);font:13px var(--m);touch-action:pan-y;-webkit-overflow-scrolling:touch;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:auto;-webkit-user-select:none;user-select:none}
#bar{position:sticky;top:0;z-index:30;background:rgba(6,10,8,.97);border-bottom:1px solid rgba(182,220,174,.35);padding:calc(8px + env(safe-area-inset-top)) 10px 8px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
#bar h1{margin:0;font:700 14px var(--m);letter-spacing:1px;flex:1;min-width:0}
#bar .patch{flex:1 0 100%;font:700 16px var(--m);letter-spacing:1.2px;color:#e8ffe0}
#unlock .patch{font:700 18px var(--m);letter-spacing:1.4px;color:#e8ffe0}
#bar a.back,#bar button.back{min-height:44px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(182,220,174,.6);border-radius:6px;background:rgba(40,60,40,.85);color:#e8ffe0;text-decoration:none;font:700 12px var(--m);touch-action:manipulation}
#unlock{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(4,8,6,.92);flex-direction:column;gap:14px;touch-action:manipulation}
#unlock button{min-height:56px;min-width:70vw;font:700 16px var(--m);letter-spacing:2px;border:1px solid var(--g);background:rgba(40,60,40,.7);color:#e8ffe0;border-radius:8px}
#vols{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:8px 10px;border-bottom:1px solid rgba(182,220,174,.22)}
#vols label{min-width:0;font-size:11px;letter-spacing:.4px;display:flex;flex-direction:column;gap:2px}
#vols input[type=range],#thrbox input[type=range],.lvl input[type=range],#stest input[type=range]{width:100%;height:36px;margin:0;accent-color:#b6dcae;touch-action:none}
#stest{padding:8px 10px 10px;border-bottom:1px solid rgba(182,220,174,.28);display:flex;flex-direction:column;gap:6px}
#stest .top{display:grid;grid-template-columns:92px minmax(0,1fr);gap:6px;align-items:center}
#stest select{min-height:44px;width:100%;background:#0c100e;color:#e8ffe0;border:1px solid rgba(182,220,174,.5);border-radius:6px;font:16px var(--m);padding:0 8px}
#stest .wide{display:flex;align-items:center;gap:8px;font:700 12px var(--m)}
#stest .wide input{flex:1}
#stest .note{margin:0;font-size:12px;opacity:.8}
#stest .btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#stest .btns button{min-height:44px;border-radius:6px;border:1px solid rgba(182,220,174,.5);background:rgba(20,32,24,.9);color:#e8ffe0;font:700 12px var(--m);touch-action:manipulation;padding:0 4px}
#stest .btns button.on{background:rgba(70,110,60,.95);border-color:#e8ffe0}
#pickList{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.pick{display:grid;grid-template-columns:74px minmax(0,1fr) 54px 54px;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid rgba(182,220,174,.16)}
.pick .nm{font:700 12px var(--m);letter-spacing:.3px;color:#e8ffe0;line-height:1.15}
.pick select{width:100%;min-width:0;min-height:44px;background:#0c100e;color:#e8ffe0;border:1px solid rgba(182,220,174,.45);border-radius:6px;font:16px var(--m);padding:0 4px}
.pick button{min-height:44px;border-radius:6px;font:700 11px var(--m);touch-action:manipulation;padding:0}
.pick .play{background:rgba(36,64,40,.95);color:#e8ffe0;border:1px solid rgba(182,220,174,.55)}
.pick .stop{background:rgba(52,30,30,.95);color:#f0d0c8;border:1px solid rgba(220,160,150,.5)}
.pick .lvl{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:11px}
.pick .lvl b{min-width:28px;text-align:right}
#thrbox{padding:6px 10px;border-bottom:1px solid rgba(182,220,174,.25);display:none}
#thrbox.on{display:block}
#applyDock{position:sticky;bottom:0;z-index:32;background:rgba(6,10,8,.97);border-top:1px solid rgba(182,220,174,.45);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
#applyDock a,#applyDock button{width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(182,220,174,.75);border-radius:8px;background:rgba(70,110,60,.96);color:#f4ffe8;text-decoration:none;font:700 16px var(--m);letter-spacing:1px;touch-action:manipulation}
canvas#gl{position:fixed;inset:0;opacity:0;pointer-events:none;width:1px;height:1px}
.hud,.btn,#brief,#tut,#end,#badge,#setb,#pauseb,#pauseOv,#setp,#vig,#teach,#thr,#lock,#rel,#flr,#brk,#ecm,#rot,#mvig,#list,#flareSec,#musicBox,#pan,#note{display:none!important}
.hide{display:none!important}
</style>
</head>
<body>
<div id="unlock"><div style="letter-spacing:3px;font-weight:700">DEEP STRIKE · s17</div><div class="patch" data-patch>s17 · 17q</div><div style="opacity:.75">SOUND TESTER</div><button type="button" id="unlockBtn">TAP TO UNLOCK AUDIO</button></div>
