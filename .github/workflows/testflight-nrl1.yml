name: TestFlight nrl1

# Packages the lab web game on this branch as its own iOS app and uploads it
# to TestFlight. It does not build Neon Rift 2.
# Manual only. Shahbaz approved the nrls-2 upload as the paid nrl1 app.
# This does not build the frozen nrl1-25 keeper. Run it by hand for the next build.
on:
  workflow_dispatch:

concurrency:
  group: testflight-nrl1
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testflight:
    name: Archive and upload nrl1
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out neon-rift-lab
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${latest}" ]; then
            latest=$(ls -d /Applications/Xcode_*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Selecting ${latest}"
          sudo xcode-select -s "${latest}"
          xcodebuild -version

      - name: Confirm this is the nrls-11 web game
        run: |
          set -euo pipefail
          grep -q 'nrls-11' index.html
          grep -q "CACHE = 'nrls-11'" sw.js
          test -f ios/nrl1.xcodeproj/project.pbxproj

      - name: Install the App Store Connect client
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/asc-venv"
          "${RUNNER_TEMP}/asc-venv/bin/pip" install --disable-pip-version-check PyJWT cryptography
          "${RUNNER_TEMP}/asc-venv/bin/python" tools/asc.py self-test
          echo "${RUNNER_TEMP}/asc-venv/bin" >> "${GITHUB_PATH}"
          echo "ASC_PYTHON=${RUNNER_TEMP}/asc-venv/bin/python" >> "${GITHUB_ENV}"

      - name: Install the API key
        run: |
          "${ASC_PYTHON}" tools/asc.py install-key

      - name: Register the bundle ID and choose the build number
        id: prepare
        run: |
          "${ASC_PYTHON}" tools/asc.py prepare

      # Install-only signing: one fixed NRL1 certificate (TB4K2QATUT) and profile from secrets.
      # This workflow never creates or revokes certificates or profiles.
      - name: Install the fixed NRL1 certificate and profile from secrets
        env:
          NRL_DIST_P12: ${{ secrets.NRL_DIST_P12 }}
          NRL_DIST_P12_PASSWORD: ${{ secrets.NRL_DIST_P12_PASSWORD }}
          NRL_PROFILE: ${{ secrets.NRL_PROFILE }}
        run: |
          set -euo pipefail
          d="${RUNNER_TEMP}/signing"; mkdir -p "$d"; chmod 700 "$d"
          printf '%s' "${NRL_DIST_P12}" | base64 -D > "$d/distribution.p12"
          printf '%s' "${NRL_DIST_P12_PASSWORD}" > "$d/password.txt"
          printf '%s' "${NRL_PROFILE}" | base64 -D > "$d/profile.mobileprovision"
          chmod 600 "$d"/*
          security cms -D -i "$d/profile.mobileprovision" > "$d/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$d/profile.plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$d/profile.plist")
          cat > "$d/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>provisioningProfiles</key><dict><key>com.shaz010.nrl1</key><string>${name}</string></dict>
          <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          {
            echo "SIGNING_P12_PATH=$d/distribution.p12"
            echo "SIGNING_PASSWORD_PATH=$d/password.txt"
            echo "SIGNING_PROFILE_PATH=$d/profile.mobileprovision"
            echo "SIGNING_PROFILE_UUID=${uuid}"
            echo "SIGNING_PROFILE_NAME=${name}"
            echo "SIGNING_IDENTITY=Apple Distribution"
            echo "EXPORT_OPTIONS_PLIST=$d/ExportOptions.plist"
          } >> "${GITHUB_ENV}"

      - name: Install the signing assets
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          password="$(cat "${SIGNING_PASSWORD_PATH}")"
          security create-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          security list-keychains -d user -s "${keychain}" login.keychain-db
          security default-keychain -s "${keychain}"
          security import "${SIGNING_P12_PATH}" -k "${keychain}" -P "${password}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${password}" "${keychain}"
          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          cp "${SIGNING_PROFILE_PATH}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${SIGNING_PROFILE_UUID}.mobileprovision"
          security find-identity -v -p codesigning "${keychain}" | tee "${RUNNER_TEMP}/identities.txt"
          grep -E "Apple Distribution|iPhone Distribution" "${RUNNER_TEMP}/identities.txt"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/nrl1.xcodeproj \
            -scheme nrl1 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${RUNNER_TEMP}/nrl1.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${SIGNING_IDENTITY}" \
            PROVISIONING_PROFILE_SPECIFIER="${SIGNING_PROFILE_NAME}" \
            PRODUCT_BUNDLE_IDENTIFIER=com.shaz010.nrl1 \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            MARKETING_VERSION=1.0

      - name: Export the IPA
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "${RUNNER_TEMP}/nrl1.xcarchive" \
            -exportPath "${RUNNER_TEMP}/export" \
            -exportOptionsPlist "${EXPORT_OPTIONS_PLIST}"
          find "${RUNNER_TEMP}/export" -name '*.ipa' -print

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          ipa=$(find "${RUNNER_TEMP}/export" -name '*.ipa' -print | head -1)
          test -n "${ipa}"
          test -f "${ipa}"
          echo "Uploading nrl1 build ${BUILD_NUMBER}"
          set +e
          xcrun iTMSTransporter -m upload -assetFile "${ipa}" -apiKey "${ASC_KEY_ID}" -apiIssuer "${ASC_ISSUER_ID}"
          status=$?
          if [ "${status}" -ne 0 ]; then
            echo "iTMSTransporter exited ${status}. Trying altool."
            xcrun altool --upload-app -f "${ipa}" -t ios --apiKey "${ASC_KEY_ID}" --apiIssuer "${ASC_ISSUER_ID}" --verbose
            status=$?
          fi
          exit "${status}"

      - name: Attach What to Test and internal group
        if: success()
        run: |
          "${ASC_PYTHON}" tools/asc.py note

      - name: Write the build summary
        if: success()
        run: |
          {
            echo "## nrl1 TestFlight"
            echo "- App: nrl1"
            echo "- Bundle ID: \`com.shaz010.nrl1\`"
            echo "- Marketing version: 1.0"
            echo "- Build number: ${BUILD_NUMBER}"
            echo "- Web build: nrls-11"
            echo "- Changelog: nrls-2 results page, glyph spells, snare 50% quieter, ship-stuck tap tip, haptics in app."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove the API key
        if: always()
        run: |
          rm -f "${ASC_KEY_PATH:-}" \
            "${HOME}/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "${HOME}/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "${HOME}/.private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "${RUNNER_TEMP}/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "${SIGNING_P12_PATH:-}" \
            "${SIGNING_PASSWORD_PATH:-}" \
            "${SIGNING_PROFILE_PATH:-}" \
            "${HOME}/Library/MobileDevice/Provisioning Profiles/${SIGNING_PROFILE_UUID:-missing}.mobileprovision"
          security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" || true
