name: TestFlight original

# Packages the original Neon Rift web game as the free iOS app and uploads it
# to TestFlight. It does not build nrl1 or Neon Rift 2.
# Manual only. The corrected upload is already queued.
on:
  workflow_dispatch:

concurrency:
  group: testflight-original
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testflight:
    name: Archive and upload Neon Rift
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out neon-rift-original-app
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${latest}" ]; then
            latest=$(ls -d /Applications/Xcode_*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Selecting ${latest}"
          sudo xcode-select -s "${latest}"
          xcodebuild -version

      - name: Confirm this is the original Neon Rift
        run: |
          set -euo pipefail
          grep -q 'RIFT STORM INBOUND' index.html
          grep -q 'NEON RIFT' index.html
          test -f ios/NeonRift.xcodeproj/project.pbxproj
          grep -q 'com.shaz010.neonrift' ios/NeonRift.xcodeproj/project.pbxproj

      - name: Install the App Store Connect client
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/asc-venv"
          "${RUNNER_TEMP}/asc-venv/bin/pip" install --disable-pip-version-check PyJWT cryptography
          "${RUNNER_TEMP}/asc-venv/bin/python" tools/asc.py self-test
          echo "${RUNNER_TEMP}/asc-venv/bin" >> "${GITHUB_PATH}"
          echo "ASC_PYTHON=${RUNNER_TEMP}/asc-venv/bin/python" >> "${GITHUB_ENV}"

      - name: Install the API key
        run: |
          "${ASC_PYTHON}" tools/asc.py install-key

      - name: Register the bundle ID and choose the build number
        id: prepare
        run: |
          "${ASC_PYTHON}" tools/asc.py prepare

      - name: Create the distribution certificate and App Store profile
        run: |
          "${ASC_PYTHON}" tools/asc.py provision

      - name: Install the signing assets
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          password="$(cat "${SIGNING_PASSWORD_PATH}")"
          security create-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          security list-keychains -d user -s "${keychain}" login.keychain-db
          security default-keychain -s "${keychain}"
          security import "${SIGNING_P12_PATH}" -k "${keychain}" -P "${password}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${password}" "${keychain}"
          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          cp "${SIGNING_PROFILE_PATH}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${SIGNING_PROFILE_UUID}.mobileprovision"
          security find-identity -v -p codesigning "${keychain}" | tee "${RUNNER_TEMP}/identities.txt"
          grep -E "Apple Distribution|iPhone Distribution" "${RUNNER_TEMP}/identities.txt"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/NeonRift.xcodeproj \
            -scheme NeonRift \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${RUNNER_TEMP}/NeonRift.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${SIGNING_IDENTITY}" \
            PROVISIONING_PROFILE_SPECIFIER="${SIGNING_PROFILE_NAME}" \
            PRODUCT_BUNDLE_IDENTIFIER=com.shaz010.neonrift \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            MARKETING_VERSION=1.0

      - name: Export the IPA
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "${RUNNER_TEMP}/NeonRift.xcarchive" \
            -exportPath "${RUNNER_TEMP}/export" \
            -exportOptionsPlist "${EXPORT_OPTIONS_PLIST}"
          find "${RUNNER_TEMP}/export" -name '*.ipa' -print

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          ipa=$(find "${RUNNER_TEMP}/export" -name '*.ipa' -print | head -1)
          test -n "${ipa}"
          test -f "${ipa}"
          echo "Uploading Neon Rift build ${BUILD_NUMBER}"
          set +e
          xcrun iTMSTransporter -m upload -assetFile "${ipa}" -apiKey "${ASC_KEY_ID}" -apiIssuer "${ASC_ISSUER_ID}"
          status=$?
          if [ "${status}" -ne 0 ]; then
            echo "iTMSTransporter exited ${status}. Trying altool."
            xcrun altool --upload-app -f "${ipa}" -t ios --apiKey "${ASC_KEY_ID}" --apiIssuer "${ASC_ISSUER_ID}" --verbose
            status=$?
          fi
          exit "${status}"

      - name: Attach What to Test and internal group
        if: success()
        run: |
          "${ASC_PYTHON}" tools/asc.py note

      - name: Write the build summary
        if: success()
        run: |
          {
            echo "## Neon Rift TestFlight"
            echo "- App: Neon Rift Original"
            echo "- Display name: Neon Rift"
            echo "- Bundle ID: \`com.shaz010.neonrift\`"
            echo "- Marketing version: 1.0"
            echo "- Build number: ${BUILD_NUMBER}"
            echo "- Changelog: Original Neon Rift, free edition"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove the API key
        if: always()
        run: |
          rm -f "${ASC_KEY_PATH:-}" \
            "${HOME}/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "${HOME}/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "${HOME}/.private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "${RUNNER_TEMP}/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "${SIGNING_P12_PATH:-}" \
            "${SIGNING_PASSWORD_PATH:-}" \
            "${SIGNING_PROFILE_PATH:-}" \
            "${HOME}/Library/MobileDevice/Provisioning Profiles/${SIGNING_PROFILE_UUID:-missing}.mobileprovision"
          security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" || true
