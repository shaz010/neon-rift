name: TestFlight nro-b2

# Packages the original Neon Rift web game as the free iOS app and uploads it
# to TestFlight. It does not build nrl1 or Neon Rift 2.
# Manual only. The corrected upload is already queued.
on:
  push:
    branches:
      - nro-b2
  workflow_dispatch:

concurrency:
  group: testflight-nro-b2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testflight:
    name: Archive and upload Neon Rift
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out neon-rift-original-app
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${latest}" ]; then
            latest=$(ls -d /Applications/Xcode_*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Selecting ${latest}"
          sudo xcode-select -s "${latest}"
          xcodebuild -version

      - name: Confirm this is the original Neon Rift
        run: |
          set -euo pipefail
          grep -q 'RIFT STORM INBOUND' index.html
          grep -q 'NEON RIFT' index.html
          test -f ios/NeonRift.xcodeproj/project.pbxproj
          grep -q 'com.shaz010.neonrift' ios/NeonRift.xcodeproj/project.pbxproj

      - name: Install the App Store Connect client
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/asc-venv"
          "${RUNNER_TEMP}/asc-venv/bin/pip" install --disable-pip-version-check PyJWT cryptography
          "${RUNNER_TEMP}/asc-venv/bin/python" tools/asc.py self-test
          echo "${RUNNER_TEMP}/asc-venv/bin" >> "${GITHUB_PATH}"
          echo "ASC_PYTHON=${RUNNER_TEMP}/asc-venv/bin/python" >> "${GITHUB_ENV}"

      - name: Install the API key
        run: |
          "${ASC_PYTHON}" tools/asc.py install-key

      - name: Register the bundle ID and choose the build number
        id: prepare
        run: |
          "${ASC_PYTHON}" tools/asc.py prepare

      - name: Use the existing distribution certificate TB4K2QATUT (no cert create or revoke)
        env:
          NRL_DIST_P12: ${{ secrets.NRL_DIST_P12 }}
          NRL_DIST_P12_PASSWORD: ${{ secrets.NRL_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          d="${RUNNER_TEMP}/signing"; mkdir -p "$d"; chmod 700 "$d"
          printf '%s' "${NRL_DIST_P12}" | base64 -D > "$d/distribution.p12"
          printf '%s' "${NRL_DIST_P12_PASSWORD}" > "$d/password.txt"
          chmod 600 "$d"/*
          echo "SIGNING_P12_PATH=$d/distribution.p12" >> "${GITHUB_ENV}"
          echo "SIGNING_PASSWORD_PATH=$d/password.txt" >> "${GITHUB_ENV}"
          echo "BUILD_NUMBER=2" >> "${GITHUB_ENV}"
          "${ASC_PYTHON}" tools/asc.py fixed-profile

      - name: Install the signing assets
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          password="$(cat "${SIGNING_PASSWORD_PATH}")"
          security create-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          security list-keychains -d user -s "${keychain}" login.keychain-db
          security default-keychain -s "${keychain}"
          security import "${SIGNING_P12_PATH}" -k "${keychain}" -P "${password}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${password}" "${keychain}"
          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          cp "${SIGNING_PROFILE_PATH}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${SIGNING_PROFILE_UUID}.mobileprovision"
          security find-identity -v -p codesigning "${keychain}" | tee "${RUNNER_TEMP}/identities.txt"
          grep -E "Apple Distribution|iPhone Distribution" "${RUNNER_TEMP}/identities.txt"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/NeonRift.xcodeproj \
            -scheme NeonRift \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${RUNNER_TEMP}/NeonRift.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${SIGNING_IDENTITY}" \
            PROVISIONING_PROFILE_SPECIFIER="${SIGNING_PROFILE_NAME}" \
            PRODUCT_BUNDLE_IDENTIFIER=com.shaz010.neonrift \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            MARKETING_VERSION=1.0

      - name: Export the IPA
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "${RUNNER_TEMP}/NeonRift.xcarchive" \
            -exportPath "${RUNNER_TEMP}/export" \
            -exportOptionsPlist "${EXPORT_OPTIONS_PLIST}"
          find "${RUNNER_TEMP}/export" -name '*.ipa' -print

      - name: Verify the App Store signature
        run: |
          set -euo pipefail
          ipa=$(find "${RUNNER_TEMP}/export" -name '*.ipa' -print | head -1)
          v="${RUNNER_TEMP}/verify"; rm -rf "$v"; mkdir -p "$v"
          unzip -q "${ipa}" -d "$v"
          app="$v/Payload/NeonRift.app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -vE '^(CDHash|Hash|CandidateCDHash)' | tee "$v/cs.txt"
          grep -q '^Authority=Apple Distribution' "$v/cs.txt"
          codesign --verify --deep --strict --verbose=2 "$app"
          security cms -D -i "$app/embedded.mobileprovision" > "$v/prof.plist"
          echo "Profile: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$v/prof.plist")"
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$v/prof.plist" >/dev/null 2>&1; then echo "ProvisionedDevices present"; exit 1; fi
          echo "ProvisionedDevices: none (App Store profile)"
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$v/prof.plist" >/dev/null 2>&1; then echo "Enterprise profile"; exit 1; fi
          codesign -d --entitlements :- "$app" > "$v/ent.plist" 2>/dev/null || true
          cat "$v/ent.plist"
          gta=$(/usr/libexec/PlistBuddy -c 'Print :get-task-allow' "$v/ent.plist" 2>/dev/null || echo absent)
          echo "get-task-allow: ${gta}"
          test "${gta}" != "true"
          echo "Bundle version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist") / $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "2"
          if [ -d "$app/Frameworks" ]; then for f in "$app"/Frameworks/*; do codesign -dv --verbose=4 "$f" 2>&1 | grep -E '^Authority' | head -1; done; fi

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          ipa=$(find "${RUNNER_TEMP}/export" -name '*.ipa' -print | head -1)
          test -n "${ipa}"
          echo "Uploading Neon Rift build ${BUILD_NUMBER}"
          set +e
          xcrun iTMSTransporter -m upload -assetFile "${ipa}" -apiKey "${ASC_KEY_ID}" -apiIssuer "${ASC_ISSUER_ID}"
          status=$?
          if [ "${status}" -ne 0 ]; then
            echo "iTMSTransporter exited ${status}. Trying altool."
            xcrun altool --upload-app -f "${ipa}" -t ios --apiKey "${ASC_KEY_ID}" --apiIssuer "${ASC_ISSUER_ID}" --verbose
            status=$?
          fi
          exit "${status}"

      - name: Write the build summary
        if: success()
        run: |
          {
            echo "## Neon Rift TestFlight"
            echo "- App: Neon Rift Original"
            echo "- Display name: Neon Rift"
            echo "- Bundle ID: \`com.shaz010.neonrift\`"
            echo "- Marketing version: 1.0"
            echo "- Build number: ${BUILD_NUMBER}"
            echo "- Changelog: Original Neon Rift, free edition"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove the API key
        if: always()
        run: |
          rm -f "${ASC_KEY_PATH:-}" \
            "${HOME}/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "${HOME}/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "${HOME}/.private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "${RUNNER_TEMP}/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "${SIGNING_P12_PATH:-}" \
            "${SIGNING_PASSWORD_PATH:-}" \
            "${SIGNING_PROFILE_PATH:-}" \
            "${HOME}/Library/MobileDevice/Provisioning Profiles/${SIGNING_PROFILE_UUID:-missing}.mobileprovision"
          security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" || true
