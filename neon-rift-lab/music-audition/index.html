<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<title>nrl1 music audition</title>
<style>
html,body{margin:0;background:#05060c;color:#e8f4ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
body{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 20px);box-sizing:border-box}
h1{margin:0;font-size:22px;letter-spacing:2px}
.sub{color:#8fb3c9;font-size:13px;line-height:1.45;margin:8px 0 14px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rush,.pan{width:100%;min-height:52px;border-radius:14px;border:1px solid rgba(142,197,255,.35);background:rgba(142,197,255,.08);font-weight:800;letter-spacing:1px}
.rush.on{background:rgba(255,80,140,.22);border-color:#ff5a92}
.pan{margin-top:8px}
.card{margin-top:10px;padding:10px;border-radius:16px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.card.play{border-color:rgba(94,242,214,.7);background:rgba(94,242,214,.08)}
.top{display:flex;gap:10px;align-items:baseline}
.tag{font-weight:900;font-size:20px;width:28px;color:#5ef2d6}
.name{font-weight:900;letter-spacing:1px}
.line{color:#b7c9d6;font-size:13px;margin:4px 0 8px}
.go{width:100%;min-height:48px;border-radius:12px;border:1px solid rgba(94,242,214,.45);background:rgba(94,242,214,.12);font-weight:800;letter-spacing:1px}
.card.play .go{background:#5ef2d6;color:#07140f}
.note{margin-top:14px;color:#8fb3c9;font-size:12px;line-height:1.45}
#status{min-height:1.2em;color:#ffd27a;font-weight:700;margin:8px 0}
a{color:#9fd0ff}
</style></head><body>
<h1>MUSIC AUDITION</h1>
<p class="sub">nrl1-11 preview. Six original loops, about 30–45 seconds. Tap to play. Nothing here is linked from the game.</p>
<div id="status">Tap a letter to start audio.</div>
<button class="rush" id="rush" type="button">RUSH OFF</button>
<button class="pan" id="pan" type="button">L / R TEST</button>
<div id="list"></div>
<p class="note">Headphones on. Rush is the intense version of whichever loop is playing. The L / R test is a tone in the left ear, then the right. <a href="../">nrl1 lab</a></p>
<script src="../bed.js?v=nrl1-11"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
let ctx=null,session=null,master=null,playing=null,rush=false,timer=0;
function forceStereo(node){
  try{node.channelCount=2;node.channelCountMode="explicit";node.channelInterpretation="speakers";}catch(e){}
  return node;
}
function stereoDynamics(setup){
  const input=forceStereo(ctx.createGain());
  const split=ctx.createChannelSplitter(2);
  const merge=ctx.createChannelMerger(2);
  const L=ctx.createDynamicsCompressor(), R=ctx.createDynamicsCompressor();
  setup(L); setup(R);
  input.connect(split); split.connect(L,0); split.connect(R,1);
  L.connect(merge,0,0); R.connect(merge,0,1);
  return {input:input, output:merge};
}
function unlock(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!ctx){
    ctx=new AC();
    master=forceStereo(ctx.createGain()); master.gain.value=.8;
    const glue=stereoDynamics(c=>{c.threshold.value=-12;c.knee.value=8;c.ratio.value=2.2;c.attack.value=.008;c.release.value=.18;});
    const lim=stereoDynamics(c=>{c.threshold.value=-2.5;c.knee.value=0;c.ratio.value=20;c.attack.value=.001;c.release.value=.12;});
    master.connect(glue.input); glue.output.connect(lim.input); lim.output.connect(ctx.destination);
    session=NRLBed.attach(ctx, master);
  }
  if(ctx.state==="suspended") ctx.resume();
  const o=ctx.createOscillator(), g=ctx.createGain();
  g.gain.value=.0001; o.connect(g); g.connect(master); o.start(); o.stop(ctx.currentTime+.02);
}
function paint(){
  const list=$("list"); list.innerHTML="";
  NRLBed.tracks.filter(t=>t.preview).forEach(t=>{
    const card=document.createElement("div");
    card.className="card"+(playing===t.id?" play":"");
    card.innerHTML='<div class="top"><span class="tag">'+t.tag+'</span><span class="name">'+t.name+'</span></div><div class="line">'+t.line+' · ~'+t.loop+'s</div>';
    const b=document.createElement("button");
    b.className="go"; b.type="button"; b.textContent=playing===t.id?"STOP":"PLAY";
    b.addEventListener("click",()=>toggle(t.id));
    card.appendChild(b); list.appendChild(card);
  });
  $("rush").textContent=rush?"RUSH ON":"RUSH OFF";
  $("rush").classList.toggle("on",rush);
}
function toggle(id){
  unlock();
  if(playing===id){playing=null; session.arm(); $("status").textContent="Stopped.";}
  else{playing=id; session.arm(); const t=NRLBed.byId[id]; $("status").textContent=t.tag+"  "+t.name+(rush?" · rush":"");}
  paint();
}
function tick(){ if(playing&&session) session.tick(playing,{rush:rush,menu:false}); }
$("rush").onclick=()=>{unlock(); rush=!rush; if(playing) $("status").textContent=NRLBed.byId[playing].tag+"  "+NRLBed.byId[playing].name+(rush?" · rush":""); paint();};
$("pan").onclick=()=>{
  unlock();
  playing=null; session.arm(); paint();
  const t=ctx.currentTime;
  function blip(pan,when){
    const p=ctx.createStereoPanner(); p.pan.setValueAtTime(pan, when);
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="square"; o.frequency.value=740;
    g.gain.setValueAtTime(.0001, when);
    g.gain.exponentialRampToValueAtTime(.22, when+.01);
    g.gain.exponentialRampToValueAtTime(.0001, when+.2);
    o.connect(g); g.connect(p); p.connect(master);
    o.start(when); o.stop(when+.22);
  }
  blip(-1, t); blip(1, t+.48);
  $("status").textContent="LEFT";
  setTimeout(()=>$("status").textContent="RIGHT", 460);
  setTimeout(()=>$("status").textContent="Left ear, then right ear.", 900);
};
paint();
timer=setInterval(tick, 25);
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&playing){playing=null; if(session) session.arm(); paint(); $("status").textContent="Stopped.";} });
</script></body></html>
