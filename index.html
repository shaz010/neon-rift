 for(let i=0;i<8;i++){const v=new THREE.Vector3((Math.random()-.5)*40,-10-Math.random()*20,(Math.random()-.5)*40).add(fwd.clone().multiplyScalar(-40));spr(S.pos,0xffe080,8,3,v,{g:8,fog:false})}
 blip(500,.15,.2,'sawtooth');
 const m=S.missile; if(m&&!m.decoy){const d=m.p.distanceTo(S.pos);if(d<4500){m.decoy=S.pos.clone();m.decoyV=fwd.clone().multiplyScalar(-30);m.dt=2.5;msg('MISSILE DECOYED')}else msg('TOO EARLY — WAIT')}}
function msg(t){S.msg=t;S.msgT=2}

function die(why){if(S.dead)return;S.dead=why;boomSfx(false);for(let i=0;i<30;i++)spr(S.pos,0xff8030,20,1.5,new THREE.Vector3((Math.random()-.5)*60,Math.random()*40,(Math.random()-.5)*60),{grow:20});jet.visible=false;setTimeout(()=>showEnd(false),1600)}

 for(let i=0;i<70;i++){const m=new THREE.Mesh(debG,debM);const s=1+Math.random()*4;m.scale.set(s,s*.6,s);m.position.copy(BUNK);scene.add(m);

 for(let i=0;i<24;i++)spr(BUNK.clone().add(new THREE.Vector3((Math.random()-.5)*40,10+Math.random()*30,(Math.random()-.5)*40)),0xff9040,40,1.6+Math.random(),new THREE.Vector3((Math.random()-.5)*50,40+Math.random()*80,(Math.random()-.5)*50),{grow:70});
 for(let i=0;i<30;i++)spr(BUNK.clone().add(new THREE.Vector3((Math.random()-.5)*60,Math.random()*20,(Math.random()-.5)*60)),0x2a2420,50,6+Math.random()*4,new THREE.Vector3((Math.random()-.5)*15,30+Math.random()*50,(Math.random()-.5)*15),{grow:30,add:false,o:.85});

// ---------- main loop ----------
let last=performance.now(), running=false, fpsA=[];
window.__fps=()=>{const a=fpsA.slice(-120);return a.length?1000/(a.reduce((x,y)=>x+y)/a.length):0};
function step(now){requestAnimationFrame(step);let dt=Math.min(.05,(now-last)/1000);last=now;fpsA.push(dt*1000);if(fpsA.length>300)fpsA.shift();
 if(running&&!S.dead&&S.phase!=='done')update(dt); else if(running&&S.dead){updParts(dt)}

function update(rdt){
 // time scale
 let target=1; if(S.bomb&&S.bomb.tti<1.8)target=.22; if(S.phase==='penetrate')target=.35; S.ts=lerp(S.ts,target,clamp(rdt*6,0,1)); const dt=rdt*S.ts; S.t+=rdt;
 // controls: instant & predictable; self-level on release
 S.tRoll=-inp.x*45*D2R; S.tPitch=-inp.y*30*D2R;
 S.roll+=(S.tRoll-S.roll)*clamp(rdt*7,0,1); S.pitch+=(S.tPitch-S.pitch)*clamp(rdt*6,0,1);
 S.yaw+=S.roll*.75*dt;
 const spd=110+S.thr*120; fwd.set(-Math.sin(S.yaw)*Math.cos(S.pitch),Math.sin(S.pitch),-Math.cos(S.yaw)*Math.cos(S.pitch));
 S.pos.addScaledVector(fwd,spd*dt); S.pos.y=Math.min(S.pos.y,2500);
 const agl=S.pos.y-H(S.pos.x,S.pos.z); S.agl=agl; S.spd=spd;
 if(agl<2)return die('TERRAIN IMPACT');
 // radar detection
 if(agl>150){S.det=Math.min(100,S.det+(20+(agl-150)*.08)*dt);S.detT+=dt}else S.det=Math.max(0,S.det-12*dt);
 S.peakDet=Math.max(S.peakDet,S.det);
 if(S.det>=100&&!S.missile){launchSAM();S.det=75}
 // lock maintenance
 if(S.phase==='release'){const q=inBox(); if(bDist()<350||!scr(BUNK)){S.locked=false;S.phase='ingress';msg('LOCK LOST — TURN BACK')}
  if(relDown&&bDist()<3000){S.relHold+=rdt;if(S.relHold>=.5)release()}else S.relHold=Math.max(0,S.relHold-rdt*2)} else S.relHold=0;
 // bomb
 const b=S.bomb; if(b){const to=tmp.copy(b.aim).sub(b.p),d=to.length();b.s=Math.min(420,b.s+120*dt);b.v.lerp(to.normalize().multiplyScalar(b.s),clamp(dt*1.4,0,1));b.v.y-=3*dt;b.p.addScaledVector(b.v,dt);b.tti=d/b.v.length();
  bomb.position.copy(b.p);bomb.lookAt(tmp.copy(b.p).add(b.v));if(d<6||b.p.y<b.aim.y){S.bomb=null;bomb.visible=false;S.phase='penetrate';S.penT=0;blip(90,.4,.4,'sine');
   for(let i=0;i<10;i++)spr(BUNK,0x9a8a70,15,2,new THREE.Vector3((Math.random()-.5)*20,20+Math.random()*20,(Math.random()-.5)*20),{grow:15,add:false,o:.8})}}
 if(S.phase==='penetrate'){S.penT+=rdt;if(S.penT>1.6)bigBoom()}
 if(S.boomT>=0){S.boomT+=dt;const t=S.boomT;ring.scale.setScalar(20+t*520);ring.material.opacity=Math.max(0,1-t/2.2);fball.scale.setScalar(Math.min(140,20+t*260)*(1+t*.2));fball.material.opacity=Math.max(0,1-t/1.6);
  fball.material.color.setHSL(.08-.05*Math.min(1,t),1,.6);if(t>2.4){ring.visible=false;fball.visible=false}}
 for(const d of debris){d.v.y-=30*dt;d.m.position.addScaledVector(d.v,dt);d.m.rotation.x+=d.r.x*dt;d.m.rotation.y+=d.r.y*dt;const gy=H(d.m.position.x,d.m.position.z);if(d.m.position.y<gy){d.m.position.y=gy;d.v.set(0,0,0);d.r.set(0,0,0)}}
 if(S.egressLaunch&&S.boomT>1.5&&!S.missile){S.egressLaunch=false;launchSAM()}
 // missile
 const m=S.missile; if(m){m.life-=dt; let tgt; if(m.decoy){m.decoy.addScaledVector(m.decoyV,dt);m.decoyV.y-=10*dt;tgt=m.decoy;m.dt-=dt}else tgt=tmp.copy(S.pos).addScaledVector(fwd,spd*.6);
  const sp=Math.min(380,m.v.length()+160*dt), dir=m.v.clone().normalize(), want=tgt.clone().sub(m.p).normalize(); dir.lerp(want,clamp(dt*1.7,0,1)).normalize(); m.v.copy(dir).multiplyScalar(sp); m.p.addScaledVector(m.v,dt);
  msl.position.copy(m.p);msl.lookAt(tmp.copy(m.p).add(m.v)); spr(m.p,0xdddddd,6,1.4,new THREE.Vector3(),{grow:6,add:false,o:.5});
  const gnd=H(m.p.x,m.p.z); let gone=false; if(!m.decoy&&m.p.distanceTo(S.pos)<14){S.missile=null;msl.visible=false;return die('HIT BY SAM')}
  if(m.p.y<gnd||m.life<=0||(m.decoy&&m.dt<=0)){gone=true} if(gone){for(let i=0;i<8;i++)spr(m.p,0xffa050,14,1,new THREE.Vector3((Math.random()-.5)*30,(Math.random()-.5)*30,(Math.random()-.5)*30),{grow:20});boomSfx(false);S.missile=null;msl.visible=false;if(!S.dead)msg(m.decoy?'MISSILE DEFEATED':'MISSILE TERRAIN-MASKED')}}
 S.flareCD=Math.max(0,S.flareCD-rdt); if(S.msgT>0)S.msgT-=rdt; S.shake=Math.max(0,S.shake-rdt);
 if(S.phase==='egress'&&S.boomT>2&&S.pos.distanceTo(EXIT)<700){S.phase='done';showEnd(true)}
 if(S.pos.z<EXZ-900&&S.phase!=='egress'&&S.phase!=='done'){die('LEFT THE AO')}
 // audio
 if(AC&&eng){const tt=AC.currentTime;eng.g.gain.setTargetAtTime(.25+S.thr*.25,tt,.1);eng.bp.frequency.setTargetAtTime((300+S.thr*1400)*S.ts,tt,.1);eng.o1.frequency.setTargetAtTime((45+S.thr*40)*S.ts,tt,.1);eng.o2.frequency.setTargetAtTime((700+S.thr*900)*S.ts,tt,.1);
  const warn=S.missile&&!S.missile.decoy; warnG.gain.setTargetAtTime(warn?((S.t*8|0)%2?1:0):0,tt,.01); tone.frequency.value=(S.t*8|0)%2?1300:1000;
  const seek=S.phase==='ingress'&&bDist()<4500&&inBox()>0; seekG.gain.setTargetAtTime(seek?((S.t*5|0)%2?.05:0):S.phase==='release'?.035:0,tt,.01); seekG.o.frequency.value=S.phase==='release'?1500:1000;}
}
function release(){S.relHold=0;S.locked=false;S.phase='bombfall';const q=inBox();S.err=(1-q)*14+Math.random()*2;const a=Math.random()*6.28;
 S.bomb={p:S.pos.clone().add(new THREE.Vector3(0,-2,0)),v:fwd.clone().multiplyScalar(S.spd),s:S.spd,aim:BUNK.clone().add(new THREE.Vector3(Math.cos(a)*S.err,0,Math.sin(a)*S.err)),tti:99};bomb.visible=true;blip(300,.2,.3,'triangle');whoosh()}
function showEnd(win){running=false;if(AC)AC.suspend();const prec=win?Math.round(clamp(100-S.err*5,0,100)):0, st=Math.round(clamp(100-S.detT/Math.max(1,S.t)*100-S.samShots*10,0,100)), tm=S.t;
 let stars=win?1+(prec>=80)+(st>=75&&tm<170):0; $('et').textContent=win?'MISSION COMPLETE':'MISSION FAILED — '+S.dead; $('es').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
 $('etab').innerHTML=`<tr><td>Precision</td><td>${prec}%${win?` (${S.err.toFixed(1)} m)`:''}</td></tr><tr><td>Stealth</td><td>${st}%</td></tr><tr><td>Time</td><td>${(tm/60|0)}:${String(tm%60|0).padStart(2,'0')}</td></tr><tr><td>SAMs evaded</td><td>${S.samShots-(win?0:1)}</td></tr>`;
 $('end').classList.remove('hide')}
// ---------- render + HUD ----------
const hud=$('hud'), hx=hud.getContext('2d'); let W=0,Hh=0,dpr=1;
function resize(){W=innerWidth;Hh=innerHeight;dpr=Math.min(devicePixelRatio,2);R.setSize(W,Hh,false);hud.width=W*dpr;hud.height=Hh*dpr;cam.aspect=W/Hh;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
function render(rdt){
 jet.position.copy(S.pos);jet.rotation.set(S.pitch,S.yaw,S.roll);jet.userData.noz.material.color.setHSL(.08,1,.4+S.thr*.3);
 // rigid chase camera: yaw-locked, horizon level, no smoothing
 cam.position.set(S.pos.x+Math.sin(S.yaw)*24,S.pos.y+6.5,S.pos.z+Math.cos(S.yaw)*24);cam.rotation.set(-.07,S.yaw,0);
 if(S.shake>0){const a=S.shake*.25;cam.position.y+=Math.sin(performance.now()*.05)*a}
 sky.position.copy(cam.position); R.render(scene,cam); drawHUD()}
function txt(s,x,y,sz=14,al='center',c='#9effb8'){hx.font=`700 ${sz}px ui-monospace,Menlo,monospace`;hx.textAlign=al;hx.fillStyle=c;hx.fillText(s,x,y)}
function tagBox(p,label,c,sz=18){const s=scr(p);if(!s||s.x<0||s.x>W||s.y<0||s.y>Hh)return;hx.strokeStyle=c;hx.lineWidth=2;hx.strokeRect(s.x-sz,s.y-sz,sz*2,sz*2);txt(label,s.x,s.y-sz-6,12,'center',c);txt((S.pos.distanceTo(p)/1000).toFixed(1)+' km',s.x,s.y+sz+14,11,'center',c);return s}
function drawHUD(){hx.setTransform(dpr,0,0,dpr,0,0);hx.clearRect(0,0,W,Hh);if(!running&&!S.dead)return;const G='#9effb8',cx=W/2,cy=Hh*.5;hx.strokeStyle=G;hx.lineWidth=1.6;hx.shadowColor='#000';hx.shadowBlur=3;
 // flight path marker
 const fp=scr(tmp.copy(S.pos).addScaledVector(fwd,1500))||{x:cx,y:cy};
 hx.beginPath();hx.arc(fp.x,fp.y,7,0,7);hx.moveTo(fp.x-18,fp.y);hx.lineTo(fp.x-7,fp.y);hx.moveTo(fp.x+7,fp.y);hx.lineTo(fp.x+18,fp.y);hx.moveTo(fp.x,fp.y-7);hx.lineTo(fp.x,fp.y-13);hx.stroke();
 // pitch ladder (level camera, so horizon = screen-fixed)
 const f=Hh/2/Math.tan(cam.fov*D2R/2);
 for(let a=-30;a<=30;a+=10){const y=cy-Math.tan(a*D2R+.07)*f;if(y<70||y>Hh-40)continue;const w=a===0?W*.22:60;hx.beginPath();if(a<0)hx.setLineDash([6,5]);hx.moveTo(cx-w,y);hx.lineTo(cx-28,y);hx.moveTo(cx+28,y);hx.lineTo(cx+w,y);hx.stroke();hx.setLineDash([]);if(a)txt(Math.abs(a),cx-w-14,y+4,11)}
 // heading tape
 const hdg=((-S.yaw/D2R)%360+360)%360;hx.beginPath();hx.moveTo(cx-130,30);hx.lineTo(cx+130,30);hx.stroke();
 for(let d=-30;d<=30;d+=5){const v=Math.round(hdg/5)*5+d,x=cx+(v-hdg)*4.2;if(x<cx-130||x>cx+130)continue;hx.beginPath();hx.moveTo(x,30);hx.lineTo(x,v%10?36:40);hx.stroke();if(v%10===0)txt(String(((v%360)+360)%360/10|0).padStart(2,'0'),x,52,11)}
 txt(String(Math.round(hdg)).padStart(3,'0'),cx,22,13);
 // speed / altitude boxes
 hx.strokeRect(cx-W*.3-60,cy-14,60,26);txt(Math.round(S.spd*1.94)+'',cx-W*.3-30,cy+5,15);txt('KT',cx-W*.3-30,cy+28,10);
 const ac=S.agl>150?'#ff6050':G;hx.strokeStyle=ac;hx.strokeRect(cx+W*.3,cy-14,64,26);txt(Math.round(S.agl||0)+'',cx+W*.3+32,cy+5,15,'center',ac);txt('AGL m',cx+W*.3+32,cy+28,10,'center',ac);hx.strokeStyle=G;
 // radar detection meter
 const mx=W-130-(parseInt(getComputedStyle(document.body).paddingRight)||0),my=70;txt('RADAR DETECTION',mx+50,my-6,10,'center',S.det>60?'#ff6050':G);hx.strokeRect(mx,my,100,10);hx.fillStyle=S.det>60?'#ff5040':S.det>25?'#ffc040':G;hx.fillRect(mx+1,my+1,98*S.det/100,8);txt('stay < 150 m AGL',mx+50,my+24,10);
 txt('FLARES '+S.flares,W*.06+40,Hh-110,11,'left');
 // HUD target box (centre)
 const showBox=S.phase==='ingress'||S.phase==='release';if(showBox&&bDist()<6000){const bw=W*.16,bh=Hh*.2;hx.setLineDash([10,8]);hx.strokeRect(cx-bw,cy-bh,bw*2,bh*2);hx.setLineDash([])}
 // threats + target labels
 if(bunker.visible){const s=tagBox(BUNK,S.phase==='release'?'◆ LOCKED':'BUNKER',S.phase==='release'?'#ffd040':G,S.phase==='release'?14:20);
  if(s&&S.phase==='release'){hx.strokeStyle='#ffd040';hx.beginPath();hx.moveTo(s.x,s.y-22);hx.lineTo(s.x+22,s.y);hx.lineTo(s.x,s.y+22);hx.lineTo(s.x-22,s.y);hx.closePath();hx.stroke()}}
 tagBox(SAMP,'SAM SITE','#ff6050',12);tagBox(tmp.copy(RADP).setY(RADP.y+24),'EW RADAR','#ffb050',12);
 if(S.missile){const s=tagBox(S.missile.p,S.missile.decoy?'DECOYED':'MISSILE','#ff3030',10)}
 if(S.bomb){const s=scr(S.bomb.p);if(s){txt('GBU',s.x+14,s.y,11,'left','#ffd040')}}
 if(S.phase==='egress')tagBox(EXIT,'EXFIL','#80d0ff',16);
 // objective (one at a time)
 let o='';const d=bDist();
 if(S.phase==='ingress')o=d<4500&&inBox()>0?'LOCK TARGET':d<4500?'PUT BUNKER IN BOX':'FLY TO BUNKER  '+(d/1000).toFixed(1)+' km';
 else if(S.phase==='release')o=d<3000?'HOLD RELEASE':'CLOSE TO RELEASE  '+(d/1000).toFixed(1)+' km';
 else if(S.phase==='bombfall')o='BOMB AWAY — '+(S.bomb?S.bomb.tti.toFixed(1):'0.0')+' s';
 else if(S.phase==='penetrate')o='PENETRATING… '+Math.min(40,Math.round(S.penT*26))+' m';
 else if(S.phase==='egress')o=S.boomT<2?'TARGET DESTROYED':'EGRESS → EXFIL  '+(S.pos.distanceTo(EXIT)/1000).toFixed(1)+' km';
 hx.shadowBlur=6;txt(o,cx,88,22,'center','#e8fff0');
 if(S.missile&&!S.missile.decoy)txt('⚠ MISSILE '+(S.missile.p.distanceTo(S.pos)/1000).toFixed(1)+' km — FLARES',cx,Hh-40,20,'center','#ff4030');
 else if(S.msgT>0)txt(S.msg,cx,Hh-40,18,'center','#ffd040');
 else if(S.agl>150&&S.phase!=='done')txt('TOO HIGH — RADAR',cx,Hh-40,16,'center','#ff6050');
 // buttons state
 $('lock').classList.toggle('off',!canLock());$('lock').classList.toggle('hot',canLock());
 const rOn=S.phase==='release'&&d<3000;$('rel').classList.toggle('off',!rOn);$('ringc').setAttribute('stroke-dasharray',`${S.relHold/.5*295} 300`);
 $('flr').classList.toggle('hot',!!(S.missile&&!S.missile.decoy));$('flr').classList.toggle('off',S.flares<=0)}
// ---------- start / tutorial ----------
const TUT=[['DRAG TO FLY','Drag anywhere with one finger: left/right banks and turns, up/down climbs or dives. Let go and the jet levels itself.'],
 ['STAY LOW','Keep under 150 m above the valley floor or enemy radar detects you and a SAM launches. Left slider = throttle.'],
 ['LOCK · RELEASE · FLARES','Put the bunker in the HUD box and tap LOCK. Hold RELEASE to drop. If a missile comes, tap FLARES.']];
let tutI=0;

$('go').addEventListener('pointerdown',e=>{e.stopPropagation();initAudio();$('start').classList.add('hide');if(localStorage.ds_tut){begin()}else{tutI=0;showTut();$('tut').classList.remove('hide')}});
$('tut').addEventListener('pointerdown',e=>{e.stopPropagation();tutI++;if(tutI>=3){localStorage.ds_tut=1;$('tut').classList.add('hide');begin()}else showTut()});
$('retry').addEventListener('pointerdown',e=>{e.stopPropagation();initAudio();begin()});
function begin(){reset();jet.visible=true;running=true;last=performance.now();if(AC)AC.resume()}
reset(); requestAnimationFrame(step);
window.__S=()=>S; window.__begin=begin; window.__inp=inp;
