:root{--g:#b6dcae;--bg:#070908;--m:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

#picked.on{display:block}
#previewWrap{display:none;position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:7;height:min(42dvh,320px);background:#000;border-bottom:1px solid rgba(182,220,174,.3)}
#previewWrap.on{display:block}
canvas#gl{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:none}
#previewLabel{position:absolute;left:10px;bottom:8px;z-index:2;padding:4px 8px;background:rgba(0,0,0,.55);border:1px solid rgba(182,220,174,.35);border-radius:4px;font:11px var(--m);pointer-events:none}
#nightBox{margin:10px;padding:10px;border:1px solid rgba(182,220,174,.4);border-radius:8px;background:rgba(8,12,10,.9);display:flex;flex-direction:column;gap:8px}
#nightBox select{min-height:44px;width:100%;background:#0c100e;color:#e8ffe0;border:1px solid rgba(182,220,174,.5);border-radius:6px;font:16px var(--m)}
#nightBox .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#nightBox button,#nightBox a.apply{min-height:44px;border-radius:6px;border:1px solid rgba(182,220,174,.5);background:rgba(20,32,24,.9);color:#e8ffe0;font:700 12px var(--m);touch-action:manipulation;display:flex;align-items:center;justify-content:center;text-decoration:none}
#nightBox .apply{grid-column:1/-1;background:rgba(70,110,60,.95)}
#nightBox p{margin:0;font-size:12px;opacity:.8;line-height:1.35}
#nvg{position:fixed;inset:0;pointer-events:none;z-index:8;display:none;background:rgba(70,160,60,.16);mix-blend-mode:screen;box-shadow:inset 0 0 90px 20px rgba(0,30,0,.55)}
#nvg.on{display:block}
#list{padding:10px 10px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid rgba(182,220,174,.32);border-radius:8px;background:rgba(12,16,14,.9)}
.row.on{border-color:#cfe8c4;box-shadow:0 0 0 1px rgba(182,220,174,.35)}
.row img.still{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#111;display:block}
.row .name{font:700 15px var(--m);letter-spacing:1.5px;color:#e8ffe0}

.row button.pick{background:rgba(60,90,50,.85);border-color:#cfe8c4}
.row button.live{background:rgba(20,36,40,.85)}
.hud,.btn,#brief,#tut,#end,#badge,#setb,#pauseb,#pauseOv,#setp,#vig,#teach,#thr,#lock,#rel,#flr,#brk,#ecm,#rot,#mvig,#hx,#ui,#panel{display:none!important}
