<style>
:root{--bg:#16243a;--teal:#5ef2d6;--mint:#9ff0c0;--sky:#8ec5ff;--lav:#c9a0ff;--coral:#ff9e8a;--amber:#ffd27a;--ink:#e6f4ff;--dim:#8fb3c9}
html,body{margin:0;height:100%;background:#16243a;overflow:hidden;touch-action:none;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;position:fixed;width:100%;color:var(--ink);-webkit-tap-highlight-color:transparent}

.panel{width:min(460px,100%);max-height:calc(100% - 24px);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:rgba(18,32,52,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(142,197,255,.22);border-radius:20px;padding:20px 18px;box-sizing:border-box;box-shadow:0 20px 60px rgba(0,0,0,.35)}

.sub{color:var(--dim);font-size:12px;letter-spacing:5px;margin:6px 0 22px}

.btn:active{transform:scale(.97)}.btn:hover{background:rgba(142,197,255,.16);border-color:rgba(94,242,214,.6)}

</div></div>

<script>
"use strict";
const cv=document.getElementById('c'),$=id=>document.getElementById(id);
let cx=cv.getContext('2d'),W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
const R=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,TAU=Math.PI*2;
/* seeded RNG for daily rift (spawns only) */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let SR=Math.random;const S=(a,b)=>a+SR()*(b-a);
function todayKey(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}

/* ---------- SAVE ---------- */
const DEF={cr:0,hs:0,up:{dash:0,shield:0,magnet:0,life:0,boost:0},skins:['tide'],skin:'tide',ach:{},st:{runs:0,dash:0,graze:0,time:0},set:{mus:60,sfx:80,hap:true,rm:false},daily:{k:0,best:0,done:false}};
let SV;try{SV=Object.assign({},DEF,JSON.parse(localStorage.getItem('neonrift2_save')||'{}'));}catch(e){SV=JSON.parse(JSON.stringify(DEF));}
for(const k of ['up','st','set','daily'])SV[k]=Object.assign({},DEF[k],SV[k]||{});
function save(){try{localStorage.setItem('neonrift2_save',JSON.stringify(SV))}catch(e){}}
let HS=SV.hs;

/* ---------- META DATA ---------- */
const UPG=[
 {k:'dash',n:'Dash Capacitor',d:l=>'Dash cooldown '+(.9-l*.1).toFixed(1)+'s',max:4,cost:l=>150+l*200},
 {k:'shield',n:'Aegis Core',d:l=>['Start without shield','Start every run shielded','Shield recharges once (40s)','Shield recharges every 30s'][l],max:3,cost:l=>[300,700,1400][l]},
 {k:'magnet',n:'Flux Magnet',d:l=>l?'Passive pickup pull '+(60+l*50)+'px':'No passive pull',max:4,cost:l=>120+l*180},
 {k:'life',n:'Reserve Hull',d:l=>l+' extra '+(l==1?'life':'lives')+' per run',max:2,cost:l=>[800,2000][l]},
 {k:'boost',n:'Salvage Broker',d:l=>'+'+l*15+'% credits per run',max:4,cost:l=>200+l*250},
];
const SKINS=[
 {k:'tide',n:'Tide Dart',c:'#5ef2d6',sh:'dart',cost:0},
 {k:'mint',n:'Mint Wisp',c:'#9ff0c0',sh:'wide',cost:300},
 {k:'sky',n:'Sky Lance',c:'#8ec5ff',sh:'lance',cost:600},
 {k:'moth',n:'Lavender Moth',c:'#c9a0ff',sh:'moth',ach:'combo10'},
 {k:'coral',n:'Coral Fang',c:'#ff9e8a',sh:'fang',cost:1200},
 {k:'amber',n:'Amber Crown',c:'#ffd27a',sh:'crown',ach:'zone4'},
 {k:'prism',n:'Prism Halo',c:'prism',sh:'lance',cost:2500},
];
const ACH=[
 {k:'surv30',n:'Survive 30s',r:40,c:s=>s.time>=30},
 {k:'surv60',n:'Survive 60s',r:80,c:s=>s.time>=60},
 {k:'surv120',n:'Survive 120s',r:200,c:s=>s.time>=120},
 {k:'surv240',n:'Survive 240s',r:500,c:s=>s.time>=240},
 {k:'combo10',n:'Get a x10 near-miss combo',r:100,c:s=>s.combo>=10,note:'Unlocks Lavender Moth'},
 {k:'mult5',n:'Reach a x5.0 multiplier',r:250,c:s=>s.mult>=5},
 {k:'score10k',n:'Score 10,000',r:60,c:s=>s.score>=1e4},
 {k:'score50k',n:'Score 50,000',r:200,c:s=>s.score>=5e4},
 {k:'score150k',n:'Score 150,000',r:500,c:s=>s.score>=15e4},
 {k:'storm',n:'Survive a Rift Storm',r:120,c:s=>s.storms>=1},
 {k:'core',n:'Destroy a Rift Core',r:300,c:s=>s.kills>=1},
 {k:'zone3',n:'Reach Amber Wastes',r:150,c:s=>s.zone>=2},
 {k:'zone4',n:'Reach Coral Abyss',r:300,c:s=>s.zone>=3,note:'Unlocks Amber Crown'},
 {k:'nova',n:'Clear the screen with a Nova Bomb',r:40,c:s=>s.bombs>=1},
 {k:'dash100',n:'Dash 100 times (lifetime)',r:100,c:s=>SV.st.dash>=100},
 {k:'graze250',n:'250 near misses (lifetime)',r:150,c:s=>SV.st.graze>=250},
 {k:'runs10',n:'Fly 10 runs',r:80,c:s=>SV.st.runs>=10},
 {k:'daily',n:'Finish a Daily Rift',r:100,c:s=>s.daily},
];
/* zones: color mood + hazard mix */
const ZONES=[
 {n:'TIDAL DRIFT',t:0,top:[22,40,62],bot:[14,24,42],grid:[94,242,214],acc:'#5ef2d6',w:{rock:7,laser:1,mine:1,seeker:0,wall:0}},
 {n:'LAVENDER NEBULA',t:50,top:[38,32,66],bot:[18,20,44],grid:[201,160,255],acc:'#c9a0ff',w:{rock:4,laser:4,mine:2,seeker:1,wall:0}},
 {n:'AMBER WASTES',t:110,top:[54,40,34],bot:[20,22,38],grid:[255,200,107],acc:'#ffd27a',w:{rock:3,laser:1,mine:4,seeker:2,wall:2}},
 {n:'CORAL ABYSS',t:175,top:[54,30,42],bot:[16,18,36],grid:[255,158,138],acc:'#ff9e8a',w:{rock:3,laser:2,mine:2,seeker:3,wall:3}},
 {n:'SKY CORE',t:250,top:[24,42,70],bot:[12,18,40],grid:[142,197,255],acc:'#8ec5ff',w:{rock:3,laser:3,mine:3,seeker:3,wall:3}},
];
function zoneAt(t){let z=0;for(let i=0;i<ZONES.length;i++)if(t>=ZONES[i].t)z=i;return z;}

/* ---------- AUDIO ---------- */
const A={ctx:null,master:null,music:null,sfx:null,step:0,next:0,intensity:0,muted:false};
function applyVol(){if(!A.ctx)return;A.master.gain.value=A.muted?0:.55;A.sfx.gain.value=SV.set.sfx/100;A.music.gain.value=.5*SV.set.mus/100;}
function audioInit(){
  if(A.ctx)return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  A.ctx=new AC(); A.master=A.ctx.createGain();
  const comp=A.ctx.createDynamicsCompressor(); A.master.connect(comp); comp.connect(A.ctx.destination);
  A.sfx=A.ctx.createGain();A.sfx.connect(A.master);
  A.music=A.ctx.createGain(); A.lp=A.ctx.createBiquadFilter(); A.lp.type='lowpass'; A.lp.frequency.value=1200;
  A.music.connect(A.lp); A.lp.connect(A.master); A.next=A.ctx.currentTime+.1;applyVol();
}
function tone(f,t,d,type,vol,dest,slide){const c=A.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||A.sfx);o.start(t);o.stop(t+d+.05);}
function noise(t,d,vol,freq,dest){const c=A.ctx,b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(dest||A.sfx);s.start(t);}
const BASS=[0,0,3,0,5,0,3,7],PROGS=[[[0,3,7],[-4,0,3],[-2,2,5],[-5,-1,2]],[[0,3,7],[-2,2,5],[-4,0,3],[-7,-3,0]],[[0,4,7],[-3,0,4],[-5,-1,2],[-1,2,5]],[[0,3,7],[1,4,8],[-2,2,5],[-4,0,3]]];
let zoneIdx=0;
function musicTick(){
  if(!A.ctx||A.muted||SV.set.mus<=0)return; const c=A.ctx;
  const bpm=110+A.intensity*60, sp=60/bpm/4, PROG=PROGS[zoneIdx%PROGS.length];
  if(A.next<c.currentTime-.5)A.next=c.currentTime+.05;
  while(A.next<c.currentTime+.15){
    const t=A.next,s=A.step%16,bar=Math.floor(A.step/16)%4,root=45+(zoneIdx%3)*2;
    const I=A.intensity;
    if(s%4==0)tone(110,t,.25,'sine',.9,A.music,40);
    if(I>.25&&(s==4||s==12))noise(t,.18,.5,1800,A.music);
    if(s%2==1||I>.6)noise(t,.04,.12+I*.1,8000,A.music);
    const bn=root+PROG[bar][0]+BASS[s%8]*(s%2?1:0);
    tone(440*Math.pow(2,(bn-69)/12),t,sp*.9,'sawtooth',.18,A.music);
    if(I>.15&&s%3==0){const ch=PROG[bar];const n=root+24+ch[(A.step/3|0)%3];tone(440*Math.pow(2,(n-69)/12),t,sp*1.5,'square',.05+I*.05,A.music);}
    A.step++;A.next+=sp;
  }
  A.lp.frequency.setTargetAtTime(700+A.intensity*5000,c.currentTime,.3);
}
const sfx={
  pick(){if(!A.ctx)return;const t=A.ctx.currentTime;[0,4,7,12].forEach((n,i)=>tone(660*Math.pow(2,n/12),t+i*.05,.15,'triangle',.25));},
  near(){if(!A.ctx)return;const t=A.ctx.currentTime;tone(1200,t,.3,'sine',.2,null,300);noise(t,.3,.25,3000);},
  boom(){if(!A.ctx)return;const t=A.ctx.currentTime;noise(t,1.2,1,400);tone(120,t,1,'sawtooth',.5,null,30);},
  shot(){if(!A.ctx)return;const t=A.ctx.currentTime;tone(900,t,.08,'square',.06,null,300);},
  dash(){if(!A.ctx)return;const t=A.ctx.currentTime;noise(t,.25,.4,1500);tone(200,t,.25,'sawtooth',.15,null,800);},
  warn(){if(!A.ctx)return;const t=A.ctx.currentTime;for(let i=0;i<3;i++){tone(440,t+i*.35,.25,'square',.15);tone(330,t+i*.35+.15,.2,'square',.15);}},
  hit(){if(!A.ctx)return;const t=A.ctx.currentTime;noise(t,.12,.5,900);},
  ui(){if(!A.ctx)return;const t=A.ctx.currentTime;tone(880,t,.06,'triangle',.12);},
  coin(){if(!A.ctx)return;const t=A.ctx.currentTime;tone(1320,t,.08,'triangle',.12);tone(1760,t+.04,.1,'triangle',.1);},
  zone(){if(!A.ctx)return;const t=A.ctx.currentTime;[0,7,12,19].forEach((n,i)=>tone(330*Math.pow(2,n/12),t+i*.12,.6,'sine',.18));},
  unlock(){if(!A.ctx)return;const t=A.ctx.currentTime;[0,4,7,12,16].forEach((n,i)=>tone(523*Math.pow(2,n/12),t+i*.07,.3,'triangle',.2));}
};
function vib(p){if(SV.set.hap&&navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}}

/* ---------- INPUT ---------- */
const K={};let pointer=null;
function wake(){audioInit();if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume();}
addEventListener('keydown',e=>{K[e.code]=true;wake();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(e.code==='KeyM'){A.muted=!A.muted;applyVol();}
  if((e.code==='KeyP'||e.code==='Escape')&&G.state==='play'){G.paused?resume():pauseGame();return;}
  if((e.code==='Space'||e.code==='Enter')&&!e.repeat)action();});
addEventListener('keyup',e=>K[e.code]=false);
function pdown(x,y){wake();pointer={x,y,t:performance.now(),sx:x,sy:y,dx:0,dy:0};mouseAim=null;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(G.state!=='play'||G.paused)return;try{cv.setPointerCapture(e.pointerId)}catch(_){}pdown(e.clientX,e.clientY)});
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick'].forEach(t=>document.addEventListener(t,e=>{const ui=e.target&&e.target.closest&&e.target.closest('.panel,button,input');if(ui&&!t.startsWith('gesture'))return;if(e.cancelable)e.preventDefault()},{passive:false}));
cv.addEventListener('pointermove',e=>{e.preventDefault();if(pointer){const ev=e.getCoalescedEvents?e.getCoalescedEvents():[];const last=ev.length?ev[ev.length-1]:e;pointer.dx+=last.clientX-pointer.x;pointer.dy+=last.clientY-pointer.y;pointer.x=last.clientX;pointer.y=last.clientY}else if(e.pointerType==='mouse'&&G.state==='play'){mouseAim={x:e.clientX,y:e.clientY}}});
cv.addEventListener('pointerup',e=>{if(pointer&&G.state==='play'&&performance.now()-pointer.t<220&&Math.hypot(e.clientX-pointer.sx,e.clientY-pointer.sy)<15)tryDash();pointer=null});

/* ---------- GAME STATE ---------- */

let P,haz,parts,pups,bullets,stars,texts,score,combo,comboT,mult,speed,elapsed,slow,shake,flash,nextSpawn,waveT,boss,bossCount,deadT,newHS,camX,camY,camZ,warnT,rings,shards,RS,zoneBanner,runCr,lives,shieldRegen;
let ink=[];
function RM(){return SV.set.rm}
function reset(){
  const u=SV.up;
  P={x:W/2,y:H*.75,vx:0,vy:0,r:11,shield:u.shield>=1?1:0,dashCD:0,dashT:0,inv:1.5,slowmo:0,magnet:0,tilt:0,trail:[],dashMax:.9-u.dash*.1};
  haz=[];parts=[];pups=[];bullets=[];texts=[];rings=[];shards=[];ink=[];
  score=0;combo=0;comboT=0;mult=1;speed=1;elapsed=0;slow=1;shake=0;flash=0;nextSpawn=1;waveT=0;boss=null;bossCount=0;deadT=0;newHS=false;camX=0;camY=0;camZ=1;warnT=0;
  RS={time:0,combo:0,mult:1,score:0,storms:0,kills:0,zone:0,bombs:0,daily:false,dash:0,graze:0,shards:0};
  zoneIdx=0;zoneBanner=0;runCr=0;lives=u.life;shieldRegen=u.shield>=2?(u.shield==2?40:30):0;P.regenUsed=false;

}
stars=[];for(let i=0;i<220;i++)stars.push({x:Math.random(),y:Math.random(),z:R(.2,1)});
function startRun(daily){G.daily=!!daily;G.resShown=false;wake();reset();G.state='play';G.paused=false;show(null);$('pauseBtn').style.display='block';zoneBanner=2.5;sfx.zone();}
function action(){

function tryDash(){if(P.dashCD<=0){P.dashCD=P.dashMax;P.dashT=.14;P.inv=Math.max(P.inv,.25);sfx.dash();vib(8);SV.st.dash++;let dx=P.vx,dy=P.vy,l=Math.hypot(dx,dy);if(l<30){dx=0;dy=-1;l=1}P.vx=dx/l*2200;P.vy=dy/l*2200;burst(P.x,P.y,skinCol(),24,300);shake+=4;}}
function pauseGame(){if(G.state!=='play')return;G.paused=true;pointer=null;for(const k in K)K[k]=false;show('pause');}
function resume(){G.paused=false;show(null);last=performance.now();}

/* ---------- SPAWNING ---------- */
const COLORS={rock:'#ff8a7a',laser:'#c3a6ff',mine:'#ffc86b',seeker:'#ffa98a',wall:'#a99cff',orb:'#f4a6c8'};
function pickKind(){const w=ZONES[zoneIdx].w;let tot=0;for(const k in w)tot+=w[k];let r=SR()*tot;for(const k in w){r-=w[k];if(r<=0)return k}return 'rock';}
function spawn(){
  const lvl=elapsed/30, k=pickKind();
  if(k==='rock'){const n=1+Math.floor(SR()*(1+lvl));for(let i=0;i<n;i++)haz.push({k:'rock',x:S(20,W-20),y:-40-i*50,vx:S(-40,40),vy:S(180,260),r:S(12,26+Math.min(lvl,6)*3),a:S(0,TAU),va:S(-3,3),sides:5+(SR()*3|0),nm:false});}
  else if(k==='laser'){haz.push({k:'laser',y:S(H*.15,H*.85),t:0,warm:1.1,life:1.6,nm:false});}
  else if(k==='mine'){haz.push({k:'mine',x:S(40,W-40),y:-30,vx:0,vy:S(90,140),r:14,a:0,fuse:0,nm:false});}
  else if(k==='seeker'){haz.push({k:'seeker',x:SR()<.5?-20:W+20,y:S(0,H*.4),vx:0,vy:0,r:10,life:7,nm:false});}
  else {const gap=S(110,170)-Math.min(40,lvl*6),gx=S(gap,W-gap);haz.push({k:'wall',y:-20,vy:200+Math.min(lvl,8)*20,gx,gap,nm:false});}
  if(SR()<.09){const ks=['shield','slow','magnet','bomb'];pups.push({k:ks[SR()*4|0],x:S(40,W-40),y:-20,t:0});}
}
function startBoss(){bossCount++;sfx.warn();vib([60,60,60]);warnT=2.5;boss={x:W/2,y:-160,ty:H*.2,hp:1,t:0,phase:0,lvl:bossCount,dur:16+bossCount*2,ang:0};}

/* ---------- FX ---------- */
function burst(x,y,col,n,sp){if(RM())n=Math.ceil(n*.5);for(let i=0;i<n;i++){const a=R(0,TAU),s=R(.2,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:R(.4,1),max:1,col,sz:R(1.5,3.5)});}}
function txt(x,y,s,col,sz){texts.push({x,y,s,col,sz:sz||22,life:1.2});}
function addScore(v,x,y){score+=v*mult;}
function nearMiss(x,y){combo++;comboT=2.5;mult=1+Math.floor(combo/3)*.5;mult=Math.min(mult,10);slow=.3;P.slowFX=.5;addScore(50,x,y);txt(x,y-20,'NEAR MISS x'+mult.toFixed(1),'#5ef2d6',18);sfx.near();vib(6);RS.graze++;SV.st.graze++;RS.combo=Math.max(RS.combo,combo);RS.mult=Math.max(RS.mult,mult);rings.push({x:P.x,y:P.y,r:10,life:.5});}
function die(){
  if(P.shield>0){P.shield=0;P.inv=1.5;shake+=15;flash=.6;burst(P.x,P.y,'#8ec5ff',60,500);sfx.hit();vib(40);txt(P.x,P.y-30,'SHIELD BROKEN','#8ec5ff',20);clearNear(160);P.shieldT=0;return;}
  if(lives>0){lives--;P.inv=2.2;shake+=20;flash=.6;burst(P.x,P.y,'#ffd27a',80,550);sfx.boom();vib([40,40,80]);txt(P.x,P.y-30,'HULL RESERVE · '+lives+' LEFT','#ffd27a',20);clearNear(240);rings.push({x:P.x,y:P.y,r:10,life:1,big:true});return;}
  sfx.boom();vib([80,40,160]);burst(P.x,P.y,'#5ef2d6',120,700);burst(P.x,P.y,'#fff',60,400);burst(P.x,P.y,'#c9a0ff',80,550);shake=40;flash=1;slow=.15;
  G.state='dead';deadT=0;score=Math.floor(score);$('pauseBtn').style.display='none';pointer=null;
  if(score>HS){HS=score;newHS=true;}
  endRun();
}
function clearNear(rad){for(const h of haz){if(h.k==='rock'||h.k==='mine'||h.k==='seeker'||h.k==='orb'){if(Math.hypot(h.x-P.x,h.y-P.y)<rad){h.dead=true;burst(h.x,h.y,COLORS[h.k],20,300)}}}}
function bomb(){flash=.8;shake+=25;sfx.boom();vib(60);RS.bombs++;for(const h of haz){if(h.x!==undefined)burst(h.x,h.y,COLORS[h.k],15,300);h.dead=true;addScore(25)}rings.push({x:P.x,y:P.y,r:10,life:1,big:true});txt(W/2,H/2,'NOVA BOMB','#fff',40);}
function dropShard(x,y,n){for(let i=0;i<n;i++)shards.push({x:x+R(-8,8),y:y+R(-8,8),vx:R(-80,80),vy:R(-120,20),t:0});}

/* ---------- UPDATE ---------- */
function update(rdt){
  G.t+=rdt;
  if(G.state==='menu'){A.intensity=.1;updParts(rdt);return;}
  slow+=(1-slow)*Math.min(1,rdt*(G.state==='dead'?.8:2.5));
  let ts=slow*(P.slowmo>0?.55:1); const dt=rdt*ts;
  shake*=Math.pow(.02,rdt);flash=Math.max(0,flash-rdt*2);if(RM()){shake=0;flash=0;}
  updParts(dt);
  if(G.state==='dead'){deadT+=rdt;A.intensity=Math.max(0,A.intensity-rdt*.3);updHaz(dt,true);if(deadT>1.1&&G.screen!=='results'&&!G.resShown){G.resShown=true;showResults();}return;}
  elapsed+=dt;speed=1+elapsed/52;
  const nz=zoneAt(elapsed);if(nz!==zoneIdx){zoneIdx=nz;zoneBanner=3;sfx.zone();vib([20,30,20]);RS.zone=Math.max(RS.zone,nz);rings.push({x:W/2,y:H/2,r:10,life:1,big:true,col:ZONES[nz].acc});addScore(1000);}
  zoneBanner-=rdt;
  A.intensity=clamp(.15+elapsed/120+(boss?.3:0)+combo*.01,0,1);
  addScore(dt*10*speed);
  // player — snappy controls (unchanged)
  let ax=0,ay=0;
  if(K.ArrowLeft||K.KeyA)ax-=1;if(K.ArrowRight||K.KeyD)ax+=1;if(K.ArrowUp||K.KeyW)ay-=1;if(K.ArrowDown||K.KeyS)ay+=1;
  if(K.ShiftLeft||K.ShiftRight)tryDash();
  const MS=900,KR=1-Math.exp(-28*rdt);let px=P.x,py=P.y,direct=false;
  if(ax&&ay){ax*=Math.SQRT1_2;ay*=Math.SQRT1_2;}
  if(P.dashT>0){P.x+=P.vx*rdt;P.y+=P.vy*rdt;P.vx*=Math.pow(.02,rdt);P.vy*=Math.pow(.02,rdt);if(pointer){pointer.dx=0;pointer.dy=0}}
  else if(pointer){const f=1-Math.exp(-45*rdt),mx=pointer.dx*f,my=pointer.dy*f;pointer.dx-=mx;pointer.dy-=my;P.x+=mx*1.15;P.y+=my*1.15;direct=true;}
  else if(mouseAim&&!ax&&!ay){const f=1-Math.exp(-22*rdt);P.x+=(mouseAim.x-P.x)*f;P.y+=(mouseAim.y-P.y)*f;direct=true;}
  else{P.vx+=(ax*MS-P.vx)*KR;P.vy+=(ay*MS-P.vy)*KR;if(!ax&&Math.abs(P.vx)<8)P.vx=0;if(!ay&&Math.abs(P.vy)<8)P.vy=0;P.x+=P.vx*rdt;P.y+=P.vy*rdt;}
  if(direct&&rdt>0){P.vx=(P.x-px)/rdt;P.vy=(P.y-py)/rdt;}
  P.x=clamp(P.x,14,W-14);P.y=clamp(P.y,14,H-14);
  P.tilt+=(clamp(P.vx/700,-1,1)-P.tilt)*(1-Math.exp(-14*rdt));
  P.dashCD-=dt;P.dashT-=dt;P.inv-=dt;P.slowmo-=rdt;P.magnet-=dt;
  // shield regen upgrade
  if(shieldRegen&&P.shield<=0&&!(SV.up.shield==2&&P.regenUsed)){P.shieldT=(P.shieldT||0)+dt;if(P.shieldT>=shieldRegen){P.shield=1;P.shieldT=0;P.regenUsed=true;txt(P.x,P.y-30,'AEGIS ONLINE','#8ec5ff',18);sfx.pick();}}
  if(Math.random()<(RM()?.35:.55))parts.push({x:P.x+R(-3,3),y:P.y+14,vx:R(-30,30),vy:R(150,300),life:.35,max:.35,col:P.dashT>0?'#fff':skinCol(),sz:R(1.5,3)});
  {const last=ink[ink.length-1];if(!last||Math.hypot(P.x-last.x,P.y-last.y)>12){ink.push({x:P.x,y:P.y});if(ink.length>160)ink.shift();}}
  comboT-=dt;if(comboT<=0&&combo>0){combo=0;mult=1;}
  waveT+=dt;
  if(!boss&&waveT>=45){waveT=0;startBoss();}
  warnT-=rdt;
  if(!boss||boss.t>boss.dur-3){nextSpawn-=dt;if(nextSpawn<=0){spawn();nextSpawn=Math.max(.2,.9/(speed*1.15))*S(.6,1.3);}}
  if(boss)updBoss(dt);
  updHaz(dt,false);
  if(G.state!=='play')return;
  const passive=SV.up.magnet?60+SV.up.magnet*50:0;
  for(const p of pups){p.t+=dt;p.y+=140*dt;p.x+=Math.sin(p.t*3)*40*dt;
    const dx=P.x-p.x,dy=P.y-p.y,l=Math.hypot(dx,dy)||1;
    if(P.magnet>0||l<passive){p.x+=dx/l*500*dt;p.y+=dy/l*500*dt;}
    if(l<26){p.dead=true;sfx.pick();vib(12);burst(p.x,p.y,'#fff',30,300);
      if(p.k==='shield'){P.shield=1;txt(p.x,p.y,'SHIELD','#8ec5ff')}
      if(p.k==='slow'){P.slowmo=5;txt(p.x,p.y,'CHRONO','#9ff0c0')}
      if(p.k==='magnet'){P.magnet=8;txt(p.x,p.y,'MAGNET','#ffd27a')}
      if(p.k==='bomb'){bomb()}
      addScore(100);}}
  pups=pups.filter(p=>!p.dead&&p.y<H+30);
  // credit shards
  const sr=P.magnet>0?9999:90+passive;
  for(const s of shards){s.t+=dt;s.vy+=200*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.98;const dx=P.x-s.x,dy=P.y-s.y,l=Math.hypot(dx,dy)||1;if(l<sr&&s.t>.25){s.x+=dx/l*700*dt;s.y+=dy/l*700*dt;}if(l<20){s.dead=true;RS.shards++;sfx.coin();}}
  shards=shards.filter(s=>!s.dead&&s.y<H+20);
  camX+=((P.x-W/2)*-.04-camX)*Math.min(1,rdt*4);camY+=((P.y-H/2)*-.03-camY)*Math.min(1,rdt*4);
  const tz=RM()?1:1+(1-slow)*.08+(boss?.02:0);camZ+=(tz-camZ)*Math.min(1,rdt*5);
  if(RM()){camX=0;camY=0;}
}
function updHaz(dt,dead){
  const lv=speed;
  for(const h of haz){
    if(h.k==='rock'){h.x+=h.vx*dt;h.y+=h.vy*dt*lv;h.a+=h.va*dt;if(h.x<h.r||h.x>W-h.r)h.vx*=-1;}
    else if(h.k==='mine'){h.y+=h.vy*dt*lv;h.a+=dt*2;if(!dead&&Math.hypot(h.x-P.x,h.y-P.y)<130)h.fuse+=dt;if(h.fuse>.7){h.dead=true;burst(h.x,h.y,'#ffc86b',40,400);shake+=6;sfx.hit();for(let i=0;i<10;i++){const a=i/10*TAU;haz.push({k:'rock',x:h.x,y:h.y,vx:Math.cos(a)*240,vy:Math.sin(a)*240/lv,r:6,a:0,va:5,sides:3,nm:false,frag:1});}}}
    else if(h.k==='seeker'){h.life-=dt;const dx=P.x-h.x,dy=P.y-h.y,l=Math.hypot(dx,dy)||1;h.vx+=dx/l*500*dt;h.vy+=dy/l*500*dt;const s=Math.hypot(h.vx,h.vy),ms=260+lv*35;if(s>ms){h.vx*=ms/s;h.vy*=ms/s}h.x+=h.vx*dt;h.y+=h.vy*dt;if(h.life<0){h.dead=true;burst(h.x,h.y,'#ffa07a',20,200)}if(Math.random()<.5)parts.push({x:h.x,y:h.y,vx:0,vy:0,life:.3,max:.3,col:'#ffa07a',sz:2});}
    else if(h.k==='laser'){h.t+=dt;if(h.t>h.warm+h.life)h.dead=true;}
    else if(h.k==='wall'){h.y+=h.vy*dt;}
    else if(h.k==='orb'){h.x+=h.vx*dt;h.y+=h.vy*dt;}
    if(h.y>H+80||h.y<-400||h.x<-100||h.x>W+100)h.dead=true;
    if(dead||h.dead)continue;
    let d=Infinity,hitR=0;
    if(h.k==='laser'){if(h.t>h.warm){d=Math.abs(P.y-h.y);hitR=8;}else continue;}
    else if(h.k==='wall'){const dy=Math.abs(P.y-h.y);if(dy<12){const inGap=Math.abs(P.x-h.gx)<h.gap/2;if(!inGap){d=0;hitR=1}else{d=h.gap/2-Math.abs(P.x-h.gx);hitR=-1;if(d<28&&!h.nm){h.nm=true;nearMiss(P.x,P.y)}continue}}else continue;}
    else {d=Math.hypot(h.x-P.x,h.y-P.y)-h.r;hitR=P.r*.7;}
    if(d<hitR){if(P.inv<=0){if(h.k!=='laser'&&h.k!=='wall')h.dead=true;die();if(G.state==='dead')return;}}
    else if(d<hitR+26&&!h.nm&&P.inv<=0){h.nm=true;nearMiss(P.x,P.y);}
  }
  haz=haz.filter(h=>!h.dead);
}
function updBoss(dt){
  const b=boss;b.t+=dt;b.y+=(b.ty-b.y)*Math.min(1,dt*1.5);b.x=W/2+Math.sin(b.t*.7)*W*.3;b.ang+=dt*(1+b.lvl*.3);
  const rate=Math.max(.06,.16-b.lvl*.02);b.fire=(b.fire||0)-dt;
  if(b.t>2&&b.t<b.dur-2&&b.fire<=0){b.fire=rate;const ph=Math.floor(b.t/5)%3,n=ph==0?3:ph==1?2:1;
    for(let i=0;i<n;i++){let a;if(ph==0)a=b.ang+i*TAU/n;else if(ph==1)a=Math.sin(b.t*2)*1.2+Math.PI/2+(i?.3:-.3);else a=Math.atan2(P.y-b.y,P.x-b.x)+R(-.15,.15);
      const s=ph==2?340:220;haz.push({k:'orb',x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:7,nm:false});}}
  if(b.hp<=0||b.t>b.dur){const killed=b.hp<=0;burst(b.x,b.y,'#c9a0ff',150,700);burst(b.x,b.y,'#fff',80,400);shake+=30;flash=.8;slow=.25;sfx.boom();vib(80);addScore(killed?5000:2000);RS.storms++;if(killed)RS.kills++;dropShard(b.x,b.y,killed?25:12);txt(W/2,H*.4,killed?'CORE DESTROYED +'+(5000*mult|0):'STORM SURVIVED +'+(2000*mult|0),'#fff',30);for(const h of haz)if(h.k==='orb'){h.dead=true;burst(h.x,h.y,'#c9a0ff',4,100)}boss=null;waveT=0;}
}
function updParts(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt}parts=parts.filter(p=>p.life>0);if(parts.length>1200)parts.splice(0,parts.length-1200);
  for(const t of texts){t.y-=40*dt;t.life-=dt}texts=texts.filter(t=>t.life>0);
  for(const r of rings){r.r+=(r.big?1400:500)*dt;r.life-=dt}rings=rings.filter(r=>r.life>0);}

/* ---------- RUN END / PROGRESSION ---------- */
let lastResult=null;
function endRun(){
  RS.time=elapsed;RS.score=score;RS.daily=G.daily;SV.st.runs++;SV.st.time+=elapsed;
  const base=Math.floor(score/250+elapsed*1.5+RS.shards*5+RS.storms*40);
  const crRun=Math.floor(base*(1+SV.up.boost*.15));
  const unl=[];let achCr=0;
  for(const a of ACH){if(!SV.ach[a.k]&&a.c(RS)){SV.ach[a.k]=1;achCr+=a.r;unl.push('✦ '+a.n+'  +'+a.r+'◆'+(a.note?' · '+a.note.replace('Unlocks ','UNLOCKED: '):''));}}
  for(const s of SKINS)if(s.ach&&SV.ach[s.ach]&&!SV.skins.includes(s.k)){SV.skins.push(s.k);}
  let dailyBonus=0;
  if(G.daily){const k=todayKey();if(SV.daily.k!==k){SV.daily={k,best:0,done:false};}if(score>SV.daily.best)SV.daily.best=score;if(!SV.daily.done&&elapsed>=45){SV.daily.done=true;dailyBonus=150;unl.push('☀ Daily Rift cleared  +150◆');}}
  const total=crRun+achCr+dailyBonus;SV.cr+=total;SV.hs=HS;save();
  lastResult={score,newHS,time:elapsed,zone:ZONES[RS.zone].n,combo:RS.combo,total,unl,canBuy:affordable()};
  if(lastResult.canBuy)unl.push('▲ Upgrade affordable in the Hangar');
}
function affordable(){for(const u of UPG){const l=SV.up[u.k];if(l<u.max&&SV.cr>=u.cost(l))return true;}return false;}
function showResults(){
  const r=lastResult;show('results');G.screen='results';
  $('rTitle').textContent=G.daily?'DAILY RIFT · SIGNAL LOST':'SIGNAL LOST';
  $('rTime').textContent=r.time.toFixed(1)+'s';$('rZone').textContent=r.zone;$('rCombo').textContent='x'+r.combo;
  $('rBest').textContent='';$('rBest').style.color='';$('rUnl').innerHTML='';
  const dur=RM()?200:1300,t0=performance.now();let ticked=0;
  (function step(now){const k=clamp((now-t0)/dur,0,1),e=1-Math.pow(1-k,3);$('rScore').textContent=Math.floor(r.score*e).toLocaleString();$('rCr').textContent='+'+Math.floor(r.total*e)+' ◆';
