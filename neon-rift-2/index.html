<style>
:root{--bg:#16243a;--teal:#5ef2d6;--mint:#9ff0c0;--sky:#8ec5ff;--lav:#c9a0ff;--coral:#ff9e8a;--amber:#ffd27a;--ink:#e6f4ff;--dim:#8fb3c9}
html,body{margin:0;height:100%;background:#16243a;overflow:hidden;touch-action:none;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;position:fixed;width:100%;color:var(--ink);-webkit-tap-highlight-color:transparent}

.panel{width:min(460px,100%);max-height:calc(100% - 24px);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:rgba(18,32,52,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(142,197,255,.22);border-radius:20px;padding:20px 18px;box-sizing:border-box;box-shadow:0 20px 60px rgba(0,0,0,.35)}

h1{margin:0;white-space:nowrap;font-size:clamp(36px,10.2vw,72px);font-weight:900;letter-spacing:1px;color:#fff;text-shadow:3px 0 rgba(255,150,170,.55),-3px 0 rgba(110,240,215,.55),0 0 24px rgba(94,242,214,.35)}

.sub{color:var(--dim);font-size:12px;letter-spacing:5px;margin:6px 0 22px}

.btn:active{transform:scale(.97)}.btn:hover{background:rgba(142,197,255,.16);border-color:rgba(94,242,214,.6)}
.btn.pri{background:linear-gradient(135deg,rgba(94,242,214,.32),rgba(142,197,255,.24));border-color:rgba(94,242,214,.7);font-size:19px;padding:17px}
.btn.daily{border-color:rgba(255,210,122,.5);background:rgba(255,210,122,.1)}

.buy{padding:9px 12px;border-radius:11px;border:1px solid rgba(255,210,122,.5);background:rgba(255,210,122,.1);color:var(--amber);font:800 13px inherit;font-family:inherit;min-width:76px;cursor:pointer}

.sw{width:44px;height:34px}
label.set{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-weight:700;letter-spacing:1px;font-size:14px}
input[type=range]{width:55%;accent-color:#5ef2d6}input[type=checkbox]{width:24px;height:24px;accent-color:#5ef2d6}
.done{color:var(--mint)}.ach .t b{font-size:13px}

.rm .unl div{animation:pop .01s forwards}
#pauseBtn{position:fixed;top:calc(env(safe-area-inset-top) + 64px);right:14px;width:40px;height:40px;border-radius:12px;border:1px solid rgba(142,197,255,.25);background:rgba(18,32,52,.5);color:var(--ink);font:900 14px inherit;display:none;cursor:pointer}
.logo{width:min(148px,38vw);height:auto;display:block;margin:0 auto 10px;border-radius:22%}

<div class="ui" id="results"><div class="panel" style="text-align:center">
  <div style="color:var(--coral);font-weight:900;letter-spacing:4px;font-size:18px" id="rTitle">SIGNAL LOST</div>

    <div class="stat"><span>Survived</span><span id="rTime"></span></div>

  </div>

  <div class="row"><button class="btn pri" id="rRetry">ONE MORE RUN</button></div>
  <div class="row"><button class="btn" id="rHangar">HANGAR</button><button class="btn" id="rMenu">MENU</button></div>
</div></div>

<script>
"use strict";
const cv=document.getElementById('c'),$=id=>document.getElementById(id);
let cx=cv.getContext('2d'),W=0,H=0,DPR=1;
function resize(){DPR=Math.min(matchMedia('(pointer:coarse)').matches?1.5:2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
const R=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,TAU=Math.PI*2;
/* seeded RNG for daily rift (spawns only) */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let SR=Math.random;const S=(a,b)=>a+SR()*(b-a);
function todayKey(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}

/* ---------- SAVE ---------- */
const DEF={cr:0,hs:0,up:{dash:0,shield:0,magnet:0,life:0,boost:0},skins:['tide'],skin:'tide',ach:{},st:{runs:0,dash:0,graze:0,time:0},set:{mus:60,sfx:80,hap:true,rm:false},daily:{k:0,best:0,done:false}};
let SV;try{SV=Object.assign({},DEF,JSON.parse(localStorage.getItem('neonrift2_save')||'{}'));}catch(e){SV=JSON.parse(JSON.stringify(DEF));}
for(const k of ['up','st','set','daily'])SV[k]=Object.assign({},DEF[k],SV[k]||{});
function save(){try{localStorage.setItem('neonrift2_save',JSON.stringify(SV))}catch(e){}}
let HS=SV.hs;

/* ---------- META DATA ---------- */
const UPG=[
 {k:'dash',n:'Dash Capacitor',d:l=>'Dash cooldown '+(.9-l*.1).toFixed(1)+'s',max:4,cost:l=>150+l*200},
 {k:'shield',n:'Aegis Core',d:l=>['Start without shield','Start every run shielded','Shield recharges once (40s)','Shield recharges every 30s'][l],max:3,cost:l=>[300,700,1400][l]},
 {k:'magnet',n:'Flux Magnet',d:l=>l?'Passive pickup pull '+(60+l*50)+'px':'No passive pull',max:4,cost:l=>120+l*180},
 {k:'life',n:'Reserve Hull',d:l=>l+' extra '+(l==1?'life':'lives')+' per run',max:2,cost:l=>[800,2000][l]},
 {k:'boost',n:'Salvage Broker',d:l=>'+'+l*15+'% credits per run',max:4,cost:l=>200+l*250},
];
const SKINS=[
 {k:'tide',n:'Tide Dart',c:'#5ef2d6',sh:'dart',cost:0},
 {k:'mint',n:'Mint Wisp',c:'#9ff0c0',sh:'wide',cost:300},
 {k:'sky',n:'Sky Lance',c:'#8ec5ff',sh:'lance',cost:600},
 {k:'moth',n:'Lavender Moth',c:'#c9a0ff',sh:'moth',ach:'combo10'},
 {k:'coral',n:'Coral Fang',c:'#ff9e8a',sh:'fang',cost:1200},
 {k:'amber',n:'Amber Crown',c:'#ffd27a',sh:'crown',ach:'zone4'},
 {k:'prism',n:'Prism Halo',c:'prism',sh:'lance',cost:2500},
];
const ACH=[
 {k:'surv30',n:'Survive 30s',r:40,c:s=>s.time>=30},
 {k:'surv60',n:'Survive 60s',r:80,c:s=>s.time>=60},
 {k:'surv120',n:'Survive 120s',r:200,c:s=>s.time>=120},
 {k:'surv240',n:'Survive 240s',r:500,c:s=>s.time>=240},
 {k:'combo10',n:'Get a x10 near-miss combo',r:100,c:s=>s.combo>=10,note:'Unlocks Lavender Moth'},
 {k:'mult5',n:'Reach a x5.0 multiplier',r:250,c:s=>s.mult>=5},
 {k:'score10k',n:'Score 10,000',r:60,c:s=>s.score>=1e4},
 {k:'score50k',n:'Score 50,000',r:200,c:s=>s.score>=5e4},
 {k:'score150k',n:'Score 150,000',r:500,c:s=>s.score>=15e4},
 {k:'storm',n:'Survive a Rift Storm',r:120,c:s=>s.storms>=1},
 {k:'core',n:'Destroy a Rift Core',r:300,c:s=>s.kills>=1},
 {k:'zone3',n:'Reach Amber Wastes',r:150,c:s=>s.zone>=2},
 {k:'zone4',n:'Reach Coral Abyss',r:300,c:s=>s.zone>=3,note:'Unlocks Amber Crown'},
 {k:'nova',n:'Clear the screen with a Nova Bomb',r:40,c:s=>s.bombs>=1},
 {k:'dash100',n:'Dash 100 times (lifetime)',r:100,c:s=>SV.st.dash>=100},
 {k:'graze250',n:'250 near misses (lifetime)',r:150,c:s=>SV.st.graze>=250},
 {k:'runs10',n:'Fly 10 runs',r:80,c:s=>SV.st.runs>=10},
 {k:'daily',n:'Finish a Daily Rift',r:100,c:s=>s.daily},
];
/* zones: color mood + hazard mix */
const ZONES=[
 {n:'TIDAL DRIFT',t:0,top:[22,40,62],bot:[14,24,42],grid:[94,242,214],acc:'#5ef2d6',w:{rock:7,laser:1,mine:1,seeker:0,wall:0}},
 {n:'LAVENDER NEBULA',t:50,top:[38,32,66],bot:[18,20,44],grid:[201,160,255],acc:'#c9a0ff',w:{rock:4,laser:4,mine:2,seeker:1,wall:0}},
 {n:'AMBER WASTES',t:110,top:[54,40,34],bot:[20,22,38],grid:[255,200,107],acc:'#ffd27a',w:{rock:3,laser:1,mine:4,seeker:2,wall:2}},
 {n:'CORAL ABYSS',t:175,top:[54,30,42],bot:[16,18,36],grid:[255,158,138],acc:'#ff9e8a',w:{rock:3,laser:2,mine:2,seeker:3,wall:3}},
 {n:'SKY CORE',t:250,top:[24,42,70],bot:[12,18,40],grid:[142,197,255],acc:'#8ec5ff',w:{rock:3,laser:3,mine:3,seeker:3,wall:3}},
];
function zoneAt(t){let z=0;for(let i=0;i<ZONES.length;i++)if(t>=ZONES[i].t)z=i;return z;}

/* ---------- AUDIO ---------- */
const A={ctx:null,master:null,music:null,sfx:null,step:0,next:0,intensity:0,muted:false};
function applyVol(){if(!A.ctx)return;A.master.gain.value=A.muted?0:.55;A.sfx.gain.value=SV.set.sfx/100;A.music.gain.value=.5*SV.set.mus/100;}
function audioInit(){
  if(A.ctx)return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  A.ctx=new AC(); A.master=A.ctx.createGain();
  const comp=A.ctx.createDynamicsCompressor(); A.master.connect(comp); comp.connect(A.ctx.destination);
  A.sfx=A.ctx.createGain();A.sfx.connect(A.master);
  A.music=A.ctx.createGain(); A.lp=A.ctx.createBiquadFilter(); A.lp.type='lowpass'; A.lp.frequency.value=1200;
  A.music.connect(A.lp); A.lp.connect(A.master); A.next=A.ctx.currentTime+.1;applyVol();
}
function tone(f,t,d,type,vol,dest,slide){const c=A.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||A.sfx);o.start(t);o.stop(t+d+.05);}
function noise(t,d,vol,freq,dest){const c=A.ctx,b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(dest||A.sfx);s.start(t);}
const BASS=[0,0,3,0,5,0,3,7],PROGS=[[[0,3,7],[-4,0,3],[-2,2,5],[-5,-1,2]],[[0,3,7],[-2,2,5],[-4,0,3],[-7,-3,0]],[[0,4,7],[-3,0,4],[-5,-1,2],[-1,2,5]],[[0,3,7],[1,4,8],[-2,2,5],[-4,0,3]]];
let zoneIdx=0;
function musicTick(){
  if(!A.ctx||A.muted||SV.set.mus<=0)return; const c=A.ctx;
  const bpm=110+A.intensity*60, sp=60/bpm/4, PROG=PROGS[zoneIdx%PROGS.length];
  if(A.next<c.currentTime-.5)A.next=c.currentTime+.05;
  while(A.next<c.currentTime+.15){
    const t=A.next,s=A.step%16,bar=Math.floor(A.step/16)%4,root=45+(zoneIdx%3)*2;
    const I=A.intensity;
    if(s%4==0)tone(110,t,.25,'sine',.9,A.music,40);
    if(I>.25&&(s==4||s==12))noise(t,.18,.5,1800,A.music);
    if(s%2==1||I>.6)noise(t,.04,.12+I*.1,8000,A.music);
    const bn=root+PROG[bar][0]+BASS[s%8]*(s%2?1:0);
    tone(440*Math.pow(2,(bn-69)/12),t,sp*.9,'sawtooth',.18,A.music);
    if(I>.15&&s%3==0){const ch=PROG[bar];const n=root+24+ch[(A.step/3|0)%3];tone(440*Math.pow(2,(n-69)/12),t,sp*1.5,'square',.05+I*.05,A.music);}
    A.step++;A.next+=sp;
  }
  A.lp.frequency.setTargetAtTime(700+A.intensity*5000,c.currentTime,.3);
}
const sfx={
  pick(){if(!A.ctx)return;const t=A.ctx.currentTime;[0,4,7,12].forEach((n,i)=>tone(660*Math.pow(2,n/12),t+i*.05,.15,'triangle',.25));},
  near(){if(!A.ctx)return;const t=A.ctx.currentTime;tone(1200,t,.3,'sine',.2,null,300);noise(t,.3,.25,3000);},
  boom(){if(!A.ctx)return;const t=A.ctx.currentTime;noise(t,1.2,1,400);tone(120,t,1,'sawtooth',.5,null,30);},
  shot(){if(!A.ctx)return;const t=A.ctx.currentTime;tone(900,t,.08,'square',.06,null,300);},
  dash(){if(!A.ctx)return;const t=A.ctx.currentTime;noise(t,.25,.4,1500);tone(200,t,.25,'sawtooth',.15,null,800);},
  warn(){if(!A.ctx)return;const t=A.ctx.currentTime;for(let i=0;i<3;i++){tone(440,t+i*.35,.25,'square',.15);tone(330,t+i*.35+.15,.2,'square',.15);}},
  hit(){if(!A.ctx)return;const t=A.ctx.currentTime;noise(t,.12,.5,900);},
  ui(){if(!A.ctx)return;const t=A.ctx.currentTime;tone(880,t,.06,'triangle',.12);},
  coin(){if(!A.ctx)return;const t=A.ctx.currentTime;tone(1320,t,.08,'triangle',.12);tone(1760,t+.04,.1,'triangle',.1);},
  zone(){if(!A.ctx)return;const t=A.ctx.currentTime;[0,7,12,19].forEach((n,i)=>tone(330*Math.pow(2,n/12),t+i*.12,.6,'sine',.18));},
  unlock(){if(!A.ctx)return;const t=A.ctx.currentTime;[0,4,7,12,16].forEach((n,i)=>tone(523*Math.pow(2,n/12),t+i*.07,.3,'triangle',.2));},
  seal(){if(!A.ctx)return;const t=A.ctx.currentTime;tone(196,t,.32,'sine',.26,null,70);tone(523,t,.42,'sine',.2);tone(784,t+.02,.5,'sine',.14);tone(1046,t+.05,.46,'triangle',.1);noise(t,.22,.18,3400);},
  nova(){if(!A.ctx)return;const t=A.ctx.currentTime;noise(t,.5,.8,380);tone(120,t,.42,'sawtooth',.38,null,40);tone(659,t,.14,'square',.09);tone(988,t+.04,.2,'triangle',.13);tone(1318,t+.08,.16,'sine',.07);},
  lance(){if(!A.ctx)return;const t=A.ctx.currentTime;noise(t,.14,.6,2200);noise(t+.02,.08,.35,6400);tone(1760,t,.1,'sawtooth',.09,null,220);tone(92,t,.16,'square',.2);}
};
function vib(p){if(SV.set.hap&&navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}}

/* ---------- INPUT ---------- */
const K={};let pointer=null;

/* GLYPH_LIB */
function gDist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function gPref(pts){
  const p=[0];
  for(let i=1;i<pts.length;i++)p.push(p[i-1]+gDist(pts[i-1],pts[i]));
  return p;
}
function gBBox(pts){
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const p of pts){if(p.x<minx)minx=p.x;if(p.y<miny)miny=p.y;if(p.x>maxx)maxx=p.x;if(p.y>maxy)maxy=p.y;}
  const w=maxx-minx,h=maxy-miny;
  return {minx,miny,maxx,maxy,w,h,diag:Math.hypot(w,h)};
}
function gArea(pts){
  let a=0;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++)a+=(pts[j].x+pts[i].x)*(pts[j].y-pts[i].y);
  return Math.abs(a/2);
}
function gCent(pts){
  let x=0,y=0; for(const p of pts){x+=p.x;y+=p.y;}
  const n=pts.length||1; return {x:x/n,y:y/n};
}
function gCirc(pts){
  const c=gCent(pts); let mean=0; const rs=new Array(pts.length);
  for(let i=0;i<pts.length;i++){rs[i]=Math.hypot(pts[i].x-c.x,pts[i].y-c.y);mean+=rs[i];}
  mean/=pts.length||1; if(mean<10)return 0;
  let v=0; for(const r of rs)v+=(r-mean)*(r-mean);
  return 1-Math.sqrt(v/pts.length)/mean;
}
function gSegDist(p,a,b){
  const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;
  if(l2<1e-4)return gDist(p,a);
  let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l2; t=t<0?0:t>1?1:t;
  return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));
}
function gDP(pts,eps){
  const n=pts.length; if(n<3)return pts.slice();
  const keep=new Uint8Array(n); keep[0]=1; keep[n-1]=1;
  const st=[[0,n-1]];
  while(st.length){
    const se=st.pop(),a=se[0],b=se[1];
    let maxD=0,idx=-1;
    for(let i=a+1;i<b;i++){const d=gSegDist(pts[i],pts[a],pts[b]); if(d>maxD){maxD=d;idx=i;}}
    if(idx>=0&&maxD>eps){keep[idx]=1; st.push([a,idx],[idx,b]);}
  }
  const out=[]; for(let i=0;i<n;i++)if(keep[i])out.push(pts[i]);
  return out;
}
function gCorners(pts){
  const b=gBBox(pts);
  const eps=Math.max(12, Math.min(28, b.diag*0.09));
  let s=gDP(pts,eps);
  if(s.length>2 && gDist(s[0],s[s.length-1])<Math.max(eps*1.6, 130))s=s.slice(0,-1);
  return s.length;
}
function gFindLoop(pts){
  const n=pts.length; if(n<8)return null;
  const pref=gPref(pts), j=n-1, total=pref[j];
  if(total<96)return null;
  let best=null;
  for(let i=0;i<=j-8;i++){
    const sub=total-pref[i];
    if(sub<96)continue;
    const d=gDist(pts[i],pts[j]);
    const limit=Math.max(52, Math.min(132, sub*0.28));
    if(d>limit)continue;
    const loop=pts.slice(i);
    const box=gBBox(loop);
    if(box.diag<58)continue;
    const area=gArea(loop);
    if(area<1600)continue;
    if(area/(box.diag*box.diag)<0.2)continue;
    const score=sub - d*2 + area*0.01;
    if(!best||score>best.score)best={i,j,d,sub,area,box,score,pts:loop};
  }
  return best;
}
function gOpenKind(pts){
  const n=pts.length; if(n<6)return null;
  const pref=gPref(pts), total=pref[n-1];
  if(total<120)return null;
  const a=pts[0], b=pts[n-1];
  const dx=b.x-a.x, dy=b.y-a.y, endD=Math.hypot(dx,dy)||1;
  let maxOff=0;
  for(let i=1;i<n-1;i++)maxOff=Math.max(maxOff, gSegDist(pts[i],a,b));
  const straight=maxOff<Math.max(20, total*0.07) && endD>90 && total>130;
  const ux=dx/endD, uy=dy/endD, px=-uy, py=ux;
  let flips=0, lastSign=0, extreme=0;
  for(let i=1;i<n;i++){
    const sx=pts[i].x-pts[i-1].x, sy=pts[i].y-pts[i-1].y;
    const lat=sx*px+sy*py;
    const sign=lat>7?1:lat<-7?-1:0;
    if(sign&&lastSign&&sign!==lastSign)flips++;
    if(sign)lastSign=sign;
    extreme=Math.max(extreme, Math.abs((pts[i].x-a.x)*px+(pts[i].y-a.y)*py));
  }
  if(gCirc(pts)>0.64)return null;
  const zig=flips>=2 && extreme>26 && total>130;
  if(zig)return 'zig';
  if(straight)return 'straight';
  return null;
}
function classifyGlyph(pts, opts){
  opts=opts||{};
  if(!pts||pts.length<8)return null;
  const loop=gFindLoop(pts);
  if(loop){
    const circ=gCirc(loop.pts);
    const corners=gCorners(loop.pts);
    const kind=(corners===3 && circ<0.9)?'triangle':'circle';
    const c=gCent(loop.pts);
    return {kind, pts:loop.pts, circ, corners, x:c.x, y:c.y, len:loop.sub};
  }
  const k=gOpenKind(pts);
  if(!k)return null;
  const len=gPref(pts)[pts.length-1];
  if(k==='zig' || (k==='straight' && (opts.straight || len>420))){
    const c=gCent(pts);
    return {kind:'line', pts:pts, circ:0, corners:0, x:c.x, y:c.y, len:len};
  }
  return null;
}
function pointInPoly(x,y,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x,yi=poly[i].y,xj=poly[j].x,yj=poly[j].y;
    const den=(yj-yi)||1e-9;
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/den + xi))inside=!inside;
  }
  return inside;
}
/* GLYPH_LIB_END */

function nearStroke(x,y,poly,margin){
  if(pointInPoly(x,y,poly))return true;
  let d=1e9;
  for(let i=1;i<poly.length;i++)d=Math.min(d,gSegDist({x,y},poly[i-1],poly[i]));
  if(poly.length>2)d=Math.min(d,gSegDist({x,y},poly[poly.length-1],poly[0]));
  return d<margin;
}
function extendStroke(pts){
  const n=pts.length,b=pts[n-1];
  let acc=0,ax=pts[Math.max(0,n-2)].x,ay=pts[Math.max(0,n-2)].y;
  for(let k=n-2;k>=0;k--){acc+=gDist(pts[k+1],pts[k]);ax=pts[k].x;ay=pts[k].y;if(acc>42)break;}
  let dx=b.x-ax,dy=b.y-ay,L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
  const out=pts.slice();let x=b.x,y=b.y;
  for(let s=0;s<18;s++){x+=dx*46;y+=dy*46;out.push({x,y});if(x<-30||y<-30||x>W+30||y>H+30)break;}
  return out;
}
function jitterPath(path){
  const out=[path[0]];
  for(let i=1;i<path.length;i++){
    const a=path[i-1],b=path[i],dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;
    const steps=Math.max(1,Math.round(L/26)),px=-dy/L,py=dx/L;
    for(let s=1;s<=steps;s++){const amp=s===steps?0:(Math.random()*2-1)*13;out.push({x:a.x+dx*(s/steps)+px*amp,y:a.y+dy*(s/steps)+py*amp});}
  }
  if(out.length>64){const slim=[out[0]];for(let i=1;i<out.length-1;i+=2)slim.push(out[i]);slim.push(out[out.length-1]);return slim;}
  return out;
}
function pathDist(x,y,pts){let d=1e9;for(let i=1;i<pts.length;i++)d=Math.min(d,gSegDist({x,y},pts[i-1],pts[i]));return d;}
function popHazard(h,power){
  h.dead=true;
  const x=h.x!=null?h.x:P.x,y=h.y!=null?h.y:P.y;
  burst(x,y,COLORS[h.k]||'#fff',COARSE?7:12,320);
  if(h.x!=null&&!h.frag&&h.k!=='orb'&&Math.random()<.5)dropShard(h.x,h.y,1);
  addScore(55*(power||1));
}
function castSeal(g,power){
  const margin=12+power*7;let n=0;
  for(const h of haz){
    if(h.dead||h.bound)continue;
    if(h.k==='laser'){let hit=false;for(let i=1;i<5;i++)if(nearStroke(W*i/5,h.y,g.pts,margin))hit=true;if(hit){popHazard(h,power);n++;}continue;}
    if(h.k==='wall'){let hit=false;const xs=[24,h.gx-h.gap,h.gx+h.gap,W-24];for(const x of xs)if(nearStroke(x,h.y,g.pts,margin))hit=true;if(hit){popHazard(h,power);n++;}continue;}
    if(h.x==null)continue;
    if(nearStroke(h.x,h.y,g.pts,margin+(h.r||0)*.2)){h.bound=true;h.boundT=.55+power*.08;h.vx=0;h.vy=0;h.va=0;h.fuse=0;h.pow=power;n++;addScore(25*power);}
  }
  if(boss&&nearStroke(boss.x,boss.y,g.pts,margin+24)){boss.hp-=.22+power*.08;n++;burst(boss.x,boss.y,'#5ef2d6',COARSE?8:14,260);}
  return n;
}
function castNova(g,power){
  const rad=118+power*42;let n=0;
  for(const h of haz){
    if(h.dead)continue;
    let hit=false;
    if(h.k==='laser')hit=Math.abs(h.y-g.y)<rad;
    else if(h.k==='wall')hit=Math.abs(h.y-g.y)<rad*.8;
    else if(h.x!=null)hit=Math.hypot(h.x-g.x,h.y-g.y)<rad+(h.r||0);
    if(hit){popHazard(h,power);n++;}
  }
  if(boss&&Math.hypot(boss.x-g.x,boss.y-g.y)<rad+48){boss.hp-=.38+power*.1;n++;burst(boss.x,boss.y,'#fff',COARSE?10:18,400);}
  g._r=rad;return n;
}
function castLance(g,power){
  const path=extendStroke(g.pts),width=22+power*11;let n=0;
  for(const h of haz){
    if(h.dead||h.bound)continue;
    if(h.k==='laser'||h.k==='wall'){
      let hit=false;
      for(let i=1;i<path.length&&!hit;i++){
        const a=path[i-1],b=path[i];
        const close=Math.abs(a.y-h.y)<width||Math.abs(b.y-h.y)<width||(a.y-h.y)*(b.y-h.y)<0;
        if(!close)continue;
        if(h.k==='laser'){hit=true;break;}
        const tt=Math.abs(b.y-a.y)<.001?0:Math.max(0,Math.min(1,(h.y-a.y)/(b.y-a.y)));
        const x=a.x+(b.x-a.x)*tt;
        if(Math.abs(x-h.gx)>=h.gap/2)hit=true;
      }
      if(hit){popHazard(h,power);n++;}
      continue;
    }
    if(h.x==null)continue;
    if(pathDist(h.x,h.y,path)<width+(h.r||0)*.35){popHazard(h,power);n++;}
  }
  if(boss&&pathDist(boss.x,boss.y,path)<width+36){boss.hp-=.3+power*.09;n++;burst(boss.x,boss.y,'#ead9ff',COARSE?8:14,280);}
  g._bolt=jitterPath(path);return n;
}
function resetInk(){ink.length=0;inkGrazes=0;inkIdle=0;inkTold=0;inkHold=0;}
function castGlyph(g){
  const power=Math.max(1,Math.min(6,inkGrazes));
  const n=g.kind==='circle'?castSeal(g,power):g.kind==='triangle'?castNova(g,power):castLance(g,power);
  const meta={circle:['SEAL','#5ef2d6','seal'],triangle:['NOVA','#ffd27a','nova'],line:['LANCE','#c9a0ff','lance']}[g.kind];
  const word=n?(n+' '+(g.kind==='circle'?'BOUND':g.kind==='triangle'?'SHATTERED':'HIT')):(g.kind==='circle'?'NOTHING INSIDE':'WIDE');
  banner={t:1.35,title:meta[0],sub:word+'   ·   POWER '+power,col:meta[1]};
  if(sfx[meta[2]])sfx[meta[2]]();
  chroma=1;flash=Math.min(1,flash+(g.kind==='triangle'?.65:.32));
  shake=Math.min(24,shake+(g.kind==='triangle'?8+power*2.5:4.5+power*1.6));
  if(!RM())slow=Math.min(slow,g.kind==='triangle'?.4:.64);
  vib(power>=3?[16,26,16]:14);
  RS.glyphs=(RS.glyphs||0)+1;
  if(tutT>1.4)tutT=1.3;
  spellCD=.5;
  const life=g.kind==='line'?.55:.85;
  fx.push({k:g.kind,pts:g.pts.map(p=>({x:p.x,y:p.y})),x:g.x,y:g.y,r:g._r||0,bolt:g._bolt||null,life,max:life,t:0,col:meta[1],power});
  if(fx.length>5)fx.splice(0,fx.length-5);
  resetInk();
}
function tryGlyph(){
  if(spellCD>0||G.state!=='play'||ink.length<8)return;
  const g=classifyGlyph(ink,{straight:inkIdle>.4||inkHold>0});
  if(!g)return;
  if(inkGrazes<=0){
    if(inkHold<=0){inkHold=.95;if(!banner||banner.title==='GRAZE')banner={t:.95,title:'GRAZE',sub:'NEAR-MISS WHILE THE INK IS WET',col:'#8ec5ff'};}
    return;
  }
  castGlyph(g);
}
function tickGlyphs(rdt,inkNew){
  const was=spellCD;spellCD=Math.max(0,spellCD-rdt);
  if(inkTold>0)inkTold-=rdt;
  const idleEdge=inkIdle>.4&&inkIdle-rdt<=.4;
  if(inkNew||idleEdge||inkPulse||(was>0&&spellCD===0)||(inkHold>0&&inkGrazes>0))tryGlyph();
  inkPulse=0;
  if(inkHold>0){inkHold-=rdt;if(inkHold<=0&&inkGrazes<=0)ink.length=0;}
  else if(inkIdle>1.35&&spellCD<=0){ink.length=0;inkGrazes=0;}
  for(const f of fx){f.t+=rdt;f.life-=rdt;}
  if(fx.length)fx=fx.filter(f=>f.life>0);
  if(banner){banner.t-=rdt;if(banner.t<=0)banner=null;}
  if(chroma>0)chroma=Math.max(0,chroma-rdt*3.1);
  if(tutT>0)tutT-=rdt;
  if(haz.some(h=>h.dead))haz=haz.filter(h=>!h.dead);
}

  else{P.vx+=(ax*MS-P.vx)*KR;P.vy+=(ay*MS-P.vy)*KR;if(!ax&&Math.abs(P.vx)<8)P.vx=0;if(!ay&&Math.abs(P.vy)<8)P.vy=0;P.x+=P.vx*rdt;P.y+=P.vy*rdt;}
  if(direct&&rdt>0){P.vx=(P.x-px)/rdt;P.vy=(P.y-py)/rdt;}
  P.x=clamp(P.x,14,W-14);P.y=clamp(P.y,14,H-14);

  P.dashCD-=dt;P.dashT-=dt;P.inv-=dt;P.slowmo-=rdt;P.magnet-=dt;
